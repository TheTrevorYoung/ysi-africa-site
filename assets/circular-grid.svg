<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YSI Circular Resource Unit and Freetown Circular Grid</title>
  <desc id="desc">A catchment sends waste into a Circular Resource Unit where it is weighed, inspected and sorted into materials, organics, energy candidates and true residuals. Data from each unit improves future units and builds the Freetown Circular Grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf7"/>
      <stop offset="1" stop-color="#e8f4ec"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075c37"/>
      <stop offset="1" stop-color="#0d7347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#063822" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4d6a5b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1490" cy="90" r="150" fill="#dff1d1" opacity=".55"/>
  <circle cx="90" cy="830" r="180" fill="#d8efeb" opacity=".55"/>

  <text x="80" y="86" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="3" fill="#0d7347">YSI AFRICA FLAGSHIP CONCEPT</text>
  <text x="80" y="145" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="900" fill="#17211b">DON'T MOVE THE WASTE MOUNTAIN.</text>
  <text x="80" y="205" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="900" fill="#075c37">STOP FEEDING IT.</text>
  <text x="80" y="245" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#526259">A modular, catchment-scale system that recovers value before final disposal.</text>

  <!-- Catchment -->
  <g filter="url(#shadow)">
    <rect x="75" y="345" width="260" height="210" rx="28" fill="#fff" stroke="#cfded4" stroke-width="2"/>
  </g>
  <text x="205" y="394" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#0d7347">LOCAL CATCHMENT</text>
  <path d="M120 475 L120 430 L160 405 L200 432 L240 398 L290 430 L290 475 Z" fill="#e5efe7" stroke="#6d8879" stroke-width="3"/>
  <rect x="140" y="445" width="42" height="30" fill="#c7dccd"/>
  <rect x="210" y="435" width="48" height="40" fill="#c7dccd"/>
  <text x="205" y="520" text-anchor="middle" font-family="Arial" font-size="18" fill="#46544c">Homes • markets • institutions</text>

  <line x1="335" y1="450" x2="445" y2="450" stroke="#4d6a5b" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="390" y="425" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#5d6e65">AUTHORIZED FLOW</text>

  <!-- Unit -->
  <g filter="url(#shadow)">
    <rect x="460" y="315" width="420" height="300" rx="32" fill="url(#unit)"/>
  </g>
  <text x="670" y="365" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" letter-spacing="1.5" fill="#bde38b">YSI CIRCULAR RESOURCE UNIT</text>
  <text x="670" y="413" text-anchor="middle" font-family="Arial" font-size="35" font-weight="900" fill="#fff">WEIGH. SORT. ROUTE.</text>
  <g font-family="Arial" font-size="19" font-weight="700" fill="#fff">
    <rect x="510" y="455" width="135" height="54" rx="13" fill="#ffffff" opacity=".12"/>
    <text x="578" y="489" text-anchor="middle">WEIGH</text>
    <rect x="695" y="455" width="135" height="54" rx="13" fill="#ffffff" opacity=".12"/>
    <text x="763" y="489" text-anchor="middle">INSPECT</text>
    <rect x="510" y="530" width="135" height="54" rx="13" fill="#ffffff" opacity=".12"/>
    <text x="578" y="564" text-anchor="middle">SORT</text>
    <rect x="695" y="530" width="135" height="54" rx="13" fill="#ffffff" opacity=".12"/>
    <text x="763" y="564" text-anchor="middle">RECORD</text>
  </g>

  <!-- Branches -->
  <line x1="880" y1="380" x2="970" y2="340" stroke="#4d6a5b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="880" y1="445" x2="970" y2="440" stroke="#4d6a5b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="880" y1="510" x2="970" y2="540" stroke="#4d6a5b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="880" y1="575" x2="970" y2="640" stroke="#4d6a5b" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Arial">
    <rect x="990" y="290" width="470" height="90" rx="22" fill="#fff" stroke="#cbded0" stroke-width="2"/>
    <circle cx="1040" cy="335" r="25" fill="#dff1d1"/>
    <path d="M1027 335 l10 10 l18 -22" fill="none" stroke="#075c37" stroke-width="5" stroke-linecap="round"/>
    <text x="1090" y="329" font-size="22" font-weight="900" fill="#075c37">RECOVERABLE MATERIALS</text>
    <text x="1090" y="355" font-size="17" fill="#536259">Metals • plastics • paper • verified glass routes</text>

    <rect x="990" y="400" width="470" height="90" rx="22" fill="#fff" stroke="#cbded0" stroke-width="2"/>
    <circle cx="1040" cy="445" r="25" fill="#e7f1d7"/>
    <path d="M1028 452 C1038 425 1055 427 1054 452 C1043 445 1034 448 1028 452 Z" fill="#658f38"/>
    <text x="1090" y="439" font-size="22" font-weight="900" fill="#075c37">ORGANICS</text>
    <text x="1090" y="465" font-size="17" fill="#536259">Compost • digestion • shared biological pathway</text>

    <rect x="990" y="510" width="470" height="90" rx="22" fill="#fff" stroke="#cbded0" stroke-width="2"/>
    <circle cx="1040" cy="555" r="25" fill="#fff0c9"/>
    <path d="M1041 526 C1061 548 1055 570 1040 578 C1022 568 1024 548 1041 526 Z" fill="#d6911c"/>
    <text x="1090" y="549" font-size="22" font-weight="900" fill="#075c37">ENERGY CANDIDATES</text>
    <text x="1090" y="575" font-size="17" fill="#536259">Characterize first • technology only if evidence earns it</text>

    <rect x="990" y="620" width="470" height="90" rx="22" fill="#fff" stroke="#cbded0" stroke-width="2"/>
    <circle cx="1040" cy="665" r="25" fill="#eef0ef"/>
    <path d="M1028 654 h24 l-3 24 h-18 z M1033 649 h14" fill="none" stroke="#68736d" stroke-width="4"/>
    <text x="1090" y="659" font-size="22" font-weight="900" fill="#075c37">TRUE RESIDUAL</text>
    <text x="1090" y="685" font-size="17" fill="#536259">Controlled final disposal only when recovery is not viable</text>
  </g>

  <!-- Learning / replication -->
  <line x1="670" y1="615" x2="670" y2="705" stroke="#4d6a5b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="420" y="735" width="500" height="92" rx="24" fill="#173f30"/>
  <text x="670" y="772" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="#bde38b">MATERIAL INTELLIGENCE</text>
  <text x="670" y="803" text-anchor="middle" font-family="Arial" font-size="18" fill="#fff">Mass balance • costs • destinations • failures • lessons</text>

  <line x1="920" y1="780" x2="1030" y2="780" stroke="#4d6a5b" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial">
    <rect x="1050" y="742" width="125" height="76" rx="18" fill="#dff1d1" stroke="#9fbe9f"/>
    <text x="1112" y="773" text-anchor="middle" font-size="16" font-weight="900" fill="#075c37">UNIT 02</text>
    <text x="1112" y="796" text-anchor="middle" font-size="13" fill="#4c5c53">tests product</text>
    <rect x="1200" y="742" width="125" height="76" rx="18" fill="#dff1d1" stroke="#9fbe9f"/>
    <text x="1262" y="773" text-anchor="middle" font-size="16" font-weight="900" fill="#075c37">UNIT 03</text>
    <text x="1262" y="796" text-anchor="middle" font-size="13" fill="#4c5c53">tests system</text>
    <rect x="1350" y="742" width="175" height="76" rx="18" fill="#075c37"/>
    <text x="1437" y="773" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">FREETOWN</text>
    <text x="1437" y="796" text-anchor="middle" font-size="16" font-weight="900" fill="#bde38b">CIRCULAR GRID</text>
  </g>

  <text x="80" y="866" font-family="Arial" font-size="16" fill="#617168">Development-stage concept. Technology, footprint, economics and diversion performance will be determined through Pilot 1 evidence.</text>
</svg>