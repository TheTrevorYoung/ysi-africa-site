name: Hotfix field image paths
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-field-image-paths.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish fresh field image filenames and repoint pages
        shell: bash
        run: |
          set -euo pipefail
          file assets/images/ysi-field-waste-stream.jpg
          file assets/images/ysi-field-collection-logistics.jpg
          cp assets/images/ysi-field-waste-stream.jpg assets/images/ysi-field-waste-stream-livefix-20260903.jpg
          cp assets/images/ysi-field-collection-logistics.jpg assets/images/ysi-field-collection-logistics-livefix-20260903.jpg
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'/assets/images/ysi-field-waste-stream\.(?:jpg|webp)(?:\?v=[^"\']+)?', '/assets/images/ysi-field-waste-stream-livefix-20260903.jpg?v=20260903pathfix1', text)
              text = re.sub(r'/assets/images/ysi-field-collection-logistics\.(?:jpg|webp)(?:\?v=[^"\']+)?', '/assets/images/ysi-field-collection-logistics-livefix-20260903.jpg?v=20260903pathfix1', text)
              text = re.sub(r'field-photos\.css(?:\?v=[^"\']+)?', 'field-photos.css?v=20260903pathfix1', text)
              p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/hotfix-field-image-paths.yml
          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Serve field evidence images from fresh production paths'
          git push
