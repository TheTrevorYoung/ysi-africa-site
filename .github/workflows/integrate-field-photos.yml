name: Integrate documentary field photography

on:
  push:
    paths:
      - '.github/workflows/integrate-field-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update homepage and flagship with documentary photography
        run: |
          python - <<'PY'
          from pathlib import Path

          # Homepage: replace illustrative hero with documentary field photography.
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('https://ysiafrica.org/assets/ysi-hero.jpg', 'https://ysiafrica.org/assets/field-hero.webp')
          s = s.replace('<img src="assets/ysi-hero.jpg" alt="Illustrative view of a coastal cleanup in Sierra Leone with volunteers shown mostly from behind">',
                        '<img src="assets/field-hero.webp" alt="Field cleanup work at Lumley Beach in Freetown" fetchpriority="high">')
          s = s.replace("<figcaption>Illustrative visual representing YSI's environmental mission. Documentary project photography will be added as the evidence library is completed.</figcaption>",
                        '<figcaption>Documentary field image from Lumley Beach cleanup work in Freetown • April 2026.</figcaption>')

          home_evidence = '''\n  <section class="section field-evidence" aria-labelledby="field-evidence-title">\n    <div class="wrap field-evidence-grid">\n      <div class="field-evidence-copy">\n        <p class="eyebrow">Field evidence</p>\n        <h2 id="field-evidence-title">The work starts in the field.</h2>\n        <p class="lede">YSI's longer-term systems work is grounded in direct experience with the waste stream, public-space cleanup and material handling in Freetown.</p>\n        <p>These documentary images from Lumley Beach show the practical conditions behind the strategy: mixed coastal waste, manual sorting, recoverable plastics and the visible result of sustained cleanup work.</p>\n        <div class="field-proof"><strong>Documented field work</strong><span>Lumley Beach • Freetown • April 2026</span></div>\n      </div>\n      <figure class="field-mosaic">\n        <img src="assets/field-evidence-grid.webp" loading="lazy" alt="Four documentary images from Lumley Beach showing cleanup, manual sorting, recovered plastic bottles and a cleaned shoreline">\n        <figcaption>Cleanup, material handling, recovered plastics and restored shoreline conditions documented during Lumley Beach field work.</figcaption>\n      </figure>\n    </div>\n  </section>\n'''
          marker = '  <section class="section flagship-home" aria-labelledby="flagship-home-title">'
          if 'id="field-evidence-title"' not in s:
              s = s.replace(marker, home_evidence + '\n' + marker)
          p.write_text(s)

          # Flagship: connect the proposed system to documented field experience without blurring concept vs fact.
          p = Path('flagship.html')
          s = p.read_text()
          flagship_evidence = '''\n  <section class="section field-evidence flagship-field-evidence" aria-labelledby="flagship-field-title">\n    <div class="wrap field-evidence-grid">\n      <div class="field-evidence-copy">\n        <p class="eyebrow">Field experience behind the concept</p>\n        <h2 id="flagship-field-title">Cleanup exposes the waste stream. Measurement turns it into evidence.</h2>\n        <p class="lede">YSI's Lumley Beach field work provides direct experience with mixed coastal waste, cleanup logistics, manual handling and material-recovery challenges.</p>\n        <p>The flagship concept is designed to move beyond cleanup alone by measuring what arrives, characterizing it, testing realistic recovery pathways and documenting the operating evidence needed before replication.</p>\n        <div class="field-proof"><strong>Actual field photography</strong><span>The 16-step graphics below remain concept illustrations.</span></div>\n      </div>\n      <figure class="field-mosaic">\n        <img src="assets/field-evidence-grid.webp" loading="lazy" alt="Documentary images from Lumley Beach field work showing cleanup, sorting, recovered plastic bottles and a cleaned shoreline">\n        <figcaption>Documentary field images from Lumley Beach, Freetown • April 2026.</figcaption>\n      </figure>\n    </div>\n  </section>\n'''
          marker = '  <section class="section process-section">'
          if 'id="flagship-field-title"' not in s:
              s = s.replace(marker, flagship_evidence + '\n' + marker)
          p.write_text(s)

          # Shared presentation styles.
          p = Path('styles.css')
          s = p.read_text()
          if '/* Documentary field evidence */' not in s:
              s += '''\n\n/* Documentary field evidence */\n.field-evidence{background:linear-gradient(180deg,#f8fbf7 0,#f1f7f2 100%)}\n.field-evidence-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:52px;align-items:center}\n.field-evidence-copy h2{margin-bottom:18px}\n.field-evidence-copy>p:not(.eyebrow){color:var(--muted);max-width:620px}\n.field-proof{display:flex;flex-wrap:wrap;gap:9px 14px;align-items:center;margin-top:25px;padding-top:18px;border-top:1px solid #d5e2d7}\n.field-proof strong{color:var(--green);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}\n.field-proof span{color:var(--muted);font-size:.8rem}\n.field-mosaic{margin:0;overflow:hidden;border-radius:20px;background:#dfe9df;border:1px solid #d3e1d5;box-shadow:0 18px 45px rgba(7,58,42,.10)}\n.field-mosaic img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}\n.field-mosaic figcaption{padding:11px 14px;background:#fff;color:var(--muted);font-size:.72rem;line-height:1.45}\n.flagship-field-evidence{background:#fff;border-top:1px solid #edf2ed;border-bottom:1px solid #edf2ed}\n@media(max-width:1040px){.field-evidence-grid{grid-template-columns:1fr;gap:28px}.field-evidence-copy>p:not(.eyebrow){max-width:800px}}\n@media(max-width:760px){.field-evidence{padding:62px 0}.field-mosaic{border-radius:14px}.field-mosaic figcaption{font-size:.68rem}}\n'''
          p.write_text(s)
          PY

      - name: Commit website photography enhancement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html flagship.html styles.css
          git commit -m "Integrate documentary field photography across website"
          git push
