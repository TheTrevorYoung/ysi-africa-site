name: Temporarily remove secondary images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pause-secondary-images.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide every site image except the main homepage hero
        shell: bash
        run: |
          set -euo pipefail
          marker='/* TEMPORARY SECONDARY IMAGE PAUSE — 2026-09-03 */'
          if ! grep -Fq "$marker" styles.css; then
            cat >> styles.css <<'EOF'

/* TEMPORARY SECONDARY IMAGE PAUSE — 2026-09-03
   User-approved temporary presentation rule while image-source problems are audited.
   Keep ONLY the main homepage hero photograph visible. All other image media and
   image-only containers are suppressed so no blurry/missing placeholders remain. */

/* Hide image media everywhere by default. */
img{display:none!important;}

/* Preserve exactly one public photograph: the main homepage hero image. */
.hero#top .hero-photo > img.field-hero-image{
  display:block!important;
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  object-position:center!important;
}

/* Remove all other photographic/illustration containers and their reserved space. */
figure:not(.hero-photo),
.hero-proof-rail,
.field-mosaic,
.field-gallery,
.field-shot,
.story-photo,
.hero-field-photo,
.system-figure,
.visual-step > .step-image,
.detail-visual,
.network-canvas{
  display:none!important;
  margin:0!important;
  padding:0!important;
  min-height:0!important;
  height:0!important;
  border:0!important;
}

/* Reflow sections that previously reserved a picture column. */
.field-evidence-grid,
.story-grid,
.flagship-hero-grid{
  grid-template-columns:1fr!important;
}

.field-evidence-copy,
.story-copy,
.flagship-hero-copy{
  max-width:900px;
}
EOF
          fi
          rm -f .github/workflows/pause-secondary-images.yml
          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add styles.css .github/workflows/pause-secondary-images.yml
          git commit -m 'Temporarily remove all secondary site images'
          git push
