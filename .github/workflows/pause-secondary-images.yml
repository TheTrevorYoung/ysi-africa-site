name: Pause secondary images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pause-secondary-images.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply temporary image pause
        run: |
          set -e
          if ! grep -q 'TEMPORARY SECONDARY IMAGE PAUSE' styles.css; then
            echo '' | base64 -d >> styles.css
          fi
          rm -f .github/workflows/pause-secondary-images.yml
          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add styles.css .github/workflows/pause-secondary-images.yml
          git commit -m 'Temporarily remove all secondary site images'
          git push
