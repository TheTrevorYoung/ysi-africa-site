name: Standardize Step 15 banner

on:
  push:
    paths:
      - '.github/workflows/standardize-step15-banner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-step15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build standardized Step 15 image
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import subprocess

          atlas_path = Path('assets/flagship-hq.webp')
          atlas = Image.open(atlas_path).convert('RGB')
          w, h = atlas.size
          assert w == h and w % 4 == 0, f'Unexpected atlas size: {atlas.size}'

          cell = w // 4
          scale = cell / 800.0
          S = lambda v: max(1, round(v * scale))

          step11 = atlas.crop((2*cell, 2*cell, 3*cell, 3*cell))
          step15 = atlas.crop((2*cell, 3*cell, 3*cell, 4*cell))

          # Match the locked Step 11 header proportions used across the standardized series.
          header_h = S(136)
          header = step11.crop((0, 0, cell, header_h)).copy()
          d = ImageDraw.Draw(header)
          d.rectangle((0, 0, S(590), header_h-S(3)), fill='white')

          def font_path(pattern):
              p = subprocess.check_output(['fc-match', '-f', '%{file}', pattern], text=True).strip()
              if not p:
                  raise RuntimeError(f'Font not found: {pattern}')
              return p

          bold = font_path('Liberation Sans Narrow:style=Bold')
          regular = font_path('Liberation Sans Narrow:style=Regular')
          green = (0, 69, 42)
          gray = (78, 84, 82)

          d.text((S(20), S(-6)), '15', font=ImageFont.truetype(bold, S(104)), fill=green)
          d.rectangle((S(120), S(10), S(123), S(120)), fill=green)
          d.text((S(143), S(17)), 'REPLICATE THE UNIT', font=ImageFont.truetype(bold, S(44)), fill=green)
          d.multiline_text(
              (S(143), S(70)),
              'Unit 01 informs a better Unit 02 and a\nstandardized Unit 03.',
              font=ImageFont.truetype(regular, S(22)),
              fill=gray,
              spacing=S(4),
          )

          # Keep the approved city/network scene unchanged in substance; only normalize
          # its top-banner depth to the standardized series.
          scene = step15.crop((0, S(181), cell, cell))
          scene = scene.resize((cell, cell-header_h), Image.Resampling.LANCZOS)
          out = Image.new('RGB', (cell, cell), 'white')
          out.paste(header, (0, 0))
          out.paste(scene, (0, header_h))
          out.save('assets/step15-standardized.webp', 'WEBP', quality=94, method=6)
          print('Created', Image.open('assets/step15-standardized.webp').size)
          PY
      - name: Point Step 15 banner and temporary Step 16 visual to standardized image
        run: |
          cat >> flagship-visuals.css <<'CSS'

          /* Standardized Step 15 banner — same header system as the locked visual series. */
          .network-canvas,
          .step-thumb.step-15,
          .step-thumb.step-16,
          .detail-visual.step-15{
            background-image:url("assets/step15-standardized.webp?v=20260901std15");
            background-size:cover;
            background-position:center;
          }
          CSS
          python - <<'PY'
          from pathlib import Path
          p=Path('flagship.html')
          s=p.read_text()
          s=s.replace('flagship-visuals.css?v=20260901d','flagship-visuals.css?v=20260901e')
          p.write_text(s)
          PY
      - name: Commit standardized banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/step15-standardized.webp flagship-visuals.css flagship.html
          git commit -m "Standardize Step 15 image banner"
          git push
