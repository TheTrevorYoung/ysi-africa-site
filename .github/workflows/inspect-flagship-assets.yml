name: Inspect flagship image assets

on:
  push:
    paths:
      - '.github/workflows/inspect-flagship-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode larger flagship visual
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          src=Path('assets/flagship-visual.jpg')
          encoded=''.join(src.read_text().split())
          data=base64.b64decode(encoded)
          out=Path('assets/flagship-visual-decoded.jpg')
          out.write_bytes(data)
          print('decoded bytes:', len(data))
          PY
          file assets/flagship-visual-decoded.jpg
      - name: Commit preview only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flagship-visual-decoded.jpg
          if git diff --cached --quiet; then
            echo "No preview change"
          else
            git commit -m "Add decoded flagship visual preview"
            git push
          fi
