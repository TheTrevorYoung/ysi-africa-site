name: Inspect flagship image assets

on:
  push:
    paths:
      - '.github/workflows/inspect-flagship-assets.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect larger flagship visual
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          src=Path('assets/flagship-visual.jpg')
          encoded=''.join(src.read_text().split())
          data=base64.b64decode(encoded)
          out=Path('assets/flagship-visual-decoded.jpg')
          out.write_bytes(data)
          print('decoded bytes:', len(data))
          print('jpeg start/end:', data[:2], data[-2:])
          PY
          echo 'FILE:'
          file assets/flagship-visual-decoded.jpg
          echo 'IDENTIFY:'
          identify assets/flagship-visual-decoded.jpg || true
          echo 'SHA256:'
          sha256sum assets/flagship-visual-decoded.jpg
