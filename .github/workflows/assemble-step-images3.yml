name: Install approved Step 15 and 16 visuals

on:
  push:
    branches: [main]
    paths:
      - '.image-parts3/**'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and install approved visuals
        shell: bash
        run: |
          set -euo pipefail
          required=(
            .image-parts3/step15-01.b64
            .image-parts3/step15-02.b64
            .image-parts3/step15-03.b64
            .image-parts3/step15-04.b64
            .image-parts3/step15-05.b64
            .image-parts3/step16-01.b64
            .image-parts3/step16-02.b64
            .image-parts3/step16-03.b64
            .image-parts3/step16-04.b64
            .image-parts3/step16-05.b64
            .image-parts3/step16-06.b64
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Waiting for $f"
              exit 0
            fi
          done
          mkdir -p assets/images
          cat .image-parts3/step15-*.b64 | tr -d '\n\r ' | base64 --decode > assets/images/step15-final.webp
          cat .image-parts3/step16-*.b64 | tr -d '\n\r ' | base64 --decode > assets/images/step16-final.webp
          test -s assets/images/step15-final.webp
          test -s assets/images/step16-final.webp
          cat >> flagship-visuals.css <<'CSS'

/* FINAL APPROVED STEP 15 & 16 — 2 Sep 2026 */
.step-thumb.step-15,
.detail-visual.step-15 {
  background-image:url("assets/images/step15-final.webp?v=20260902final");
  background-size:cover;
  background-position:center;
}
.network-canvas,
.step-thumb.step-16 {
  background-image:url("assets/images/step16-final.webp?v=20260902final");
  background-size:cover;
  background-position:center;
}
CSS
          rm -rf .image-parts .image-parts2 .image-parts3
          git config user.name "YSI Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Install approved Step 15 and Step 16 visuals"
          git push
