name: Install approved Step 15 and 16 visuals

on:
  push:
    branches:
      - main
    paths:
      - '.image-parts3/**'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble approved visuals when complete
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re
          import shutil

          part_dir = Path('.image-parts3')
          required = [
              *(part_dir / f'step15-{i:02d}.b64' for i in range(1, 6)),
              *(part_dir / f'step16-{i:02d}.b64' for i in range(1, 7)),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              print('Waiting for remaining image parts:')
              print('\n'.join(missing))
              raise SystemExit(0)

          def decode_series(pattern, output):
              chunks = []
              for path in sorted(part_dir.glob(pattern)):
                  chunks.append(''.join(path.read_text().split()))
              raw = base64.b64decode(''.join(chunks), validate=True)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(raw)
              if output.stat().st_size == 0:
                  raise SystemExit(f'Empty assembled image: {output}')
              print('Created', output, output.stat().st_size)

          decode_series('step15-*.b64', Path('assets/images/step15-final.webp'))
          decode_series('step16-*.b64', Path('assets/images/step16-final.webp'))

          css_path = Path('flagship-visuals.css')
          css = css_path.read_text()
          marker = '/* FINAL APPROVED STEP 15 & 16 — 2 Sep 2026 */'
          block = '''/* FINAL APPROVED STEP 15 & 16 — 2 Sep 2026 */
          .step-thumb.step-15,
          .detail-visual.step-15 {
            background-image:url("assets/images/step15-final.webp?v=20260902final");
            background-size:cover;
            background-position:center;
          }
          .network-canvas,
          .step-thumb.step-16 {
            background-image:url("assets/images/step16-final.webp?v=20260902final");
            background-size:cover;
            background-position:center;
          }
          '''
          if marker in css:
              css = re.sub(
                  r'/\* FINAL APPROVED STEP 15 & 16 — 2 Sep 2026 \*/.*?\.step-thumb\.step-16 \{.*?\}\s*',
                  '',
                  css,
                  flags=re.S,
              )
          css_path.write_text(css.rstrip() + '\n\n' + block)

          for folder in (Path('.image-parts'), Path('.image-parts2'), Path('.image-parts3')):
              if folder.exists():
                  shutil.rmtree(folder)

      - name: Commit completed visuals
        shell: bash
        run: |
          git config user.name "YSI Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No completed visual changes to commit"
            exit 0
          fi
          git commit -m "Install approved Step 15 and Step 16 visuals"
          git push
