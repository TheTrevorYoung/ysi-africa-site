name: Final permanent secondary image purge

on:
  push:
    branches: [main]
    paths: ['.github/workflows/purge-secondary-images-v4.yml']

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute validated purge with workflow files excluded from audit
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^[[:space:]]*python <<'"'"'PY'"'"'$/ {capture=1; next}
            capture && /^[[:space:]]*PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/purge-secondary-images-v3.yml > /tmp/purge_secondary_images.py
          test -s /tmp/purge_secondary_images.py

          # Remove all one-time purge workflow files before the embedded final audit.
          # This prevents the audit from mistaking workflow source-code path strings for live image references.
          rm -f .github/workflows/purge-secondary-images.yml \
                .github/workflows/purge-secondary-images-v2.yml \
                .github/workflows/purge-secondary-images-v3.yml \
                .github/workflows/purge-secondary-images-v4.yml

          python /tmp/purge_secondary_images.py

          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Permanently delete all secondary site imagery'
          git push
