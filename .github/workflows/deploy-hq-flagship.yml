name: Deploy high-resolution flagship visual

on:
  push:
    paths:
      - '.github/workflows/deploy-hq-flagship.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-hq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified high-resolution atlas
        run: |
          curl -fL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-8490-822f-8735-09e1c383ba88/raw?se=2026-09-01T09%3A52%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=17ba650f-286f-5099-a348-7143323a6cd6&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T22%3A00%3A00Z&ske=2026-09-01T22%3A00%3A00Z&sks=b&skv=2026-02-06&sig=yL9At0Tvgn%2ByMPJ0uutMUPVoO/CSsCsdXfvlNliqJnk%3D' -o assets/flagship-hq.webp
          test $(wc -c < assets/flagship-hq.webp) -gt 700000
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/flagship-hq.webp')
          d=p.read_bytes()
          assert d[:4] == b'RIFF' and d[8:12] == b'WEBP', 'Not a WebP file'
          print('HQ asset bytes:', len(d))
          PY
          file assets/flagship-hq.webp
      - name: Switch flagship visuals to HQ asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('flagship-visuals.css')
          s=p.read_text()
          s=s.replace('assets/flagship-approved-rebuilt.jpg?v=20260901d','assets/flagship-hq.webp?v=20260901hq1')
          p.write_text(s)
          PY
      - name: Commit high-resolution asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flagship-hq.webp flagship-visuals.css
          git commit -m "Upgrade flagship visuals to high-resolution atlas"
          git push
