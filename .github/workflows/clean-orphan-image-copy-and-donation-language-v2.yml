name: Clean orphan image copy and donation language v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-orphan-image-copy-and-donation-language-v2.yml']

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and audit cleanup
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          def get(n): return (root/n).read_text(encoding='utf-8')
          def put(n,s): (root/n).write_text(s,encoding='utf-8')
          def replace_required(s,a,b,label):
              if a not in s: raise SystemExit(f'missing expected source: {label}')
              return s.replace(a,b)

          # HOME: retain only the real hero-related photography language.
          s=get('index.html')
          s=replace_required(s,
              "<p>Documentary photography from Lumley Beach shows the practical conditions behind YSI's move from cleanup toward measurement, characterization, recovery and stronger environmental systems.</p>",
              "<p>Direct field experience at Lumley Beach informs YSI's move from cleanup toward measurement, characterization, recovery and stronger environmental systems.</p>",
              'orphan homepage photography copy')
          s=replace_required(s,
              '<p class="flagship-home-note">Phase 0 is non-thermal. RDF/SRF and other thermal pathways remain later technical hypotheses, not the current fundraising proposition.</p>',
              '<p class="flagship-home-note">Phase 0 is non-thermal. Current funding is focused on evidence and operational design; RDF/SRF and other thermal pathways remain later technical hypotheses subject to validation.</p>',
              'negative homepage fundraising wording')
          put('index.html',s)

          # WASTE PROJECT: use positive current-funding language.
          s=get('flagship.html')
          s=replace_required(s,
              '<span>YSI is not fundraising for the full long-term technical concept at this stage.</span>',
              '<span>Current funding is focused on Phase 0 evidence and operational design.</span>',
              'negative flagship fundraising wording')
          put('flagship.html',s)

          # FUNDERS: remove donation-policy discussion entirely, including its styling.
          s=get('funders.html')
          old=s
          s=re.sub(r'\s*<div class="no-donate"><strong>No donate button\.</strong>.*?</div>','',s,flags=re.I|re.S)
          s=re.sub(r'\.no-donate\{[^{}]*\}','',s,flags=re.I|re.S)
          if s==old: raise SystemExit('no-donate content/style not found')
          put('funders.html',s)

          # EVIDENCE: remove old deleted-gallery selector/rules while preserving evidence copy.
          s=get('evidence.html')
          s=s.replace('.legend-grid,.evidence-index,.field-gallery,.project-evidence,.method-grid{grid-template-columns:1fr}',
                      '.legend-grid,.evidence-index,.project-evidence,.method-grid{grid-template-columns:1fr}')
          s=re.sub(r'\.field-shot[^{}]*\{[^{}]*\}','',s,flags=re.I|re.S)
          put('evidence.html',s)

          # SHARED JS: do not describe deleted secondary imagery.
          s=get('script.js')
          s=replace_required(s,
              '<span>Documented YSI field activity and photography.</span>',
              '<span>Documented YSI field activity and operating records.</span>',
              'evidence dossier photography copy')
          s=s.replace("heroImage.src = '/assets/images/ysi-hero-real.jpg?v=20260903imgfix3';",
                      "heroImage.src = '/assets/images/ysi-hero-real.jpg';")
          put('script.js',s)

          # Remove obsolete cache-buster labels from every public page.
          for p in root.glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('styles.css?v=20260903-imagepause1','styles.css?v=20260903-clean2')
              s=s.replace('script.js?v=20260903imgfix3','script.js?v=20260903-clean2')
              p.write_text(s,encoding='utf-8')

          # AUDIT 1: only the approved homepage hero may have image/figure/caption markup.
          idx=get('index.html')
          assert len(re.findall(r'<img\b',idx,re.I))==1, 'homepage must have one img'
          assert len(re.findall(r'<figure\b',idx,re.I))==1, 'homepage must have one figure'
          assert len(re.findall(r'<figcaption\b',idx,re.I))==1, 'homepage must have one figcaption'
          assert 'ysi-hero-real.jpg' in idx, 'approved hero missing'
          for p in root.glob('*.html'):
              body=p.read_text(encoding='utf-8')
              if p.name!='index.html' and re.search(r'<(?:img|figure|figcaption)\b',body,re.I):
                  raise SystemExit(f'orphan image markup remains in {p.name}')

          # AUDIT 2: no donation refusal/disclaimer language anywhere public.
          public=list(root.glob('*.html'))+[root/'script.js',root/'styles.css',root/'flagship.css']
          for p in public:
              body=p.read_text(encoding='utf-8')
              for pat in (r'no donate button',r'not accepting donations?',r'not accept donations?',r'retail fundraising'):
                  if re.search(pat,body,re.I):
                      raise SystemExit(f'donation disclaimer remains in {p}: {pat}')

          # AUDIT 3: no residue from removed secondary-image components.
          forbidden=('field-gallery','hero-proof-rail','field-mosaic','field-shot','story-photo','hero-field-photo','system-figure','detail-visual','network-canvas','image-pause','imgfix3','pathfix','livefix','jpgsource')
          for p in public:
              body=p.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in body:
                      raise SystemExit(f'obsolete image residue remains in {p}: {token}')

          if 'Documentary photography from Lumley Beach shows the practical conditions' in idx:
              raise SystemExit('orphan homepage photography copy remains')
          PY

          rm -f .github/workflows/clean-orphan-image-copy-and-donation-language.yml
          rm -f .github/workflows/clean-orphan-image-copy-and-donation-language-v2.yml
          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove orphan image copy and donation disclaimers'
          git push
