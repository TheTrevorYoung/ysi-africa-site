name: Build YSI evidence and authority page

on:
  push:
    paths:
      - '.github/workflows/deploy-real-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create evidence page and strengthen entity signals
        shell: python
        run: |
          from pathlib import Path

          evidence = '''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>YSI Africa Evidence & Field Work | Sierra Leone</title>
            <meta name="description" content="Evidence and documented field work from Young Sustainability Initiative (YSI Africa), a Sierra Leone environmental organization working on waste, coastal protection and circular resource systems in Freetown.">
            <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
            <meta name="theme-color" content="#075c37">
            <link rel="canonical" href="https://ysiafrica.org/evidence.html">
            <link rel="icon" href="favicon.svg" type="image/svg+xml">
            <link rel="stylesheet" href="styles.css">
            <link rel="stylesheet" href="field-photos.css?v=20260902static1">
            <meta property="og:site_name" content="YSI Africa">
            <meta property="og:title" content="YSI Africa Evidence & Field Work | Sierra Leone">
            <meta property="og:description" content="Verified impact, documented field work and clearly labeled development-stage work from Young Sustainability Initiative in Sierra Leone.">
            <meta property="og:type" content="website">
            <meta property="og:url" content="https://ysiafrica.org/evidence.html">
            <meta property="og:image" content="https://ysiafrica.org/assets/ysi-field-waste-stream.webp">
            <meta name="twitter:card" content="summary_large_image">
            <meta name="twitter:title" content="YSI Africa Evidence & Field Work | Sierra Leone">
            <meta name="twitter:description" content="Verified impact and documented field work from Young Sustainability Initiative in Sierra Leone.">
            <meta name="twitter:image" content="https://ysiafrica.org/assets/ysi-field-waste-stream.webp">
            <script type="application/ld+json">
            {
              "@context": "https://schema.org",
              "@type": "AboutPage",
              "name": "YSI Africa Evidence & Field Work",
              "url": "https://ysiafrica.org/evidence.html",
              "description": "Evidence and documented field work from Young Sustainability Initiative (YSI Africa), a Sierra Leone environmental organization.",
              "isPartOf": {"@id": "https://ysiafrica.org/#website"},
              "about": {"@id": "https://ysiafrica.org/#organization"},
              "inLanguage": "en"
            }
            </script>
            <style>
              .evidence-hero{padding:84px 0 52px;background:linear-gradient(180deg,#f3f7f4 0%,#fff 100%)}
              .evidence-hero h1{max-width:900px;margin-bottom:18px}.evidence-hero .lede{max-width:820px}
              .evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
              .evidence-card{border:1px solid #d8e2dc;border-radius:20px;padding:28px;background:#fff;box-shadow:0 12px 32px rgba(22,45,35,.06)}
              .evidence-card h3{margin-top:0}.evidence-card strong{color:#075c37}
              .evidence-note{padding:20px 22px;border-left:4px solid #075c37;background:#f3f7f4;border-radius:0 14px 14px 0}
              .source-link{font-weight:700;color:#075c37}.status-line{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.status-line b{min-width:104px;color:#075c37}
              @media(max-width:760px){.evidence-grid{grid-template-columns:1fr}.evidence-hero{padding-top:54px}}
            </style>
          </head>
          <body>
          <a class="skip-link" href="#main">Skip to content</a>
          <header class="header">
            <div class="wrap nav-wrap">
              <a class="brand" href="index.html" aria-label="YSI Africa home"><span class="brand-ysi">YSI</span><span class="brand-africa">AFRICA</span><span class="brand-name">Young Sustainability Initiative</span></a>
              <button class="menu" aria-expanded="false" aria-controls="nav">Menu</button>
              <nav id="nav" class="nav" aria-label="Main navigation">
                <a href="index.html#about">About YSI</a><a href="index.html#work">What We Do</a><a href="flagship.html">Flagship</a><a href="evidence.html">Evidence</a><a href="index.html#projects">Projects</a><a href="index.html#transparency">Transparency</a>
                <a class="nav-cta" href="mailto:info@ysiafrica.org?subject=YSI%20Africa%20Inquiry">Contact YSI</a>
              </nav>
            </div>
          </header>
          <main id="main">
            <section class="evidence-hero"><div class="wrap"><p class="eyebrow">Evidence & field work</p><h1>Young Sustainability Initiative — YSI Africa — Sierra Leone.</h1><p class="lede">This page separates verified public impact, documented field work, independent coverage and development-stage concepts. YSI does not present proposals as completed projects or prospective institutions as partners.</p></div></section>

            <section class="section"><div class="wrap"><div class="split"><div><p class="eyebrow">Identity</p><h2>Clear institutional identity.</h2></div><div class="body-copy"><p><strong>Young Sustainability Initiative (YSI Africa)</strong> is a legally incorporated Sierra Leonean environmental nonprofit organized as a Company Limited by Guarantee.</p><p>YSI is independent, community-driven and focused on practical environmental systems in Sierra Leone, with initial operational concentration in Freetown.</p><p>This full name is used deliberately to distinguish the organization from unrelated institutions and companies that also use the acronym “YSI.”</p></div></div></div></section>

            <section class="section soft"><div class="wrap"><div class="section-head"><p class="eyebrow">What is verified</p><h2>Evidence before claims.</h2></div><div class="evidence-grid"><article class="evidence-card"><h3>Verified public impact claim</h3><p><strong>20,000+ kg of waste removed.</strong></p><p>This remains YSI Africa's current verified quantitative public impact claim. YSI does not add unsupported beneficiary, revenue, equipment or project-result statistics.</p></article><article class="evidence-card"><h3>Documented field work</h3><p>Lumley Beach cleanup and sanitation work in Freetown provide direct experience with mixed coastal waste, public-space cleanup, manual material handling and the practical realities of waste leakage.</p><p>This field experience is the evidence base for YSI's progression from cleanup toward measurement, characterization, recovery testing and stronger waste systems.</p></article></div></div></section>

            <section class="section field-evidence"><div class="wrap field-evidence-grid"><div class="field-evidence-copy"><p class="eyebrow">Lumley Beach · Freetown</p><h2>Field conditions behind the systems work.</h2><p class="lede">YSI's longer-term direction is grounded in actual waste-stream conditions rather than a purely theoretical model.</p><p>The image documents field conditions from Lumley Beach. It is presented as field evidence, not as evidence of a completed recycling or resource-recovery facility.</p><div class="field-proof"><strong>Documented field work</strong><span>Lumley Beach • Freetown • Sierra Leone</span></div></div><figure class="field-mosaic"><img src="assets/ysi-field-waste-stream.webp" loading="lazy" alt="Documented mixed waste conditions during YSI Africa field work at Lumley Beach in Freetown"><figcaption>Documented waste-stream conditions at Lumley Beach, Freetown.</figcaption></figure></div></section>

            <section class="section"><div class="wrap"><div class="split"><div><p class="eyebrow">Environmental advocacy</p><h2>Aberdeen Creek and coastal protection.</h2></div><div class="body-copy"><p>YSI has raised concerns with relevant institutions about Aberdeen Creek and the wider importance of Sierra Leone's coastal wetlands.</p><p>This is described as environmental advocacy. It is not presented as evidence that YSI controls, manages or has formal authority over the wetland.</p></div></div></div></section>

            <section class="section soft"><div class="wrap"><div class="split"><div><p class="eyebrow">Independent coverage</p><h2>External reporting on Lumley Beach field work.</h2></div><div class="body-copy"><p>On 12 April 2026, <em>South Africa Today</em> published an article identifying Young Sustainability Initiative in connection with waste-removal activity at Lumley Beach in Freetown.</p><p><a class="source-link" href="https://southafricatoday.net/africa/young-volunteers-clear-100-days-of-plastic-waste-from-freetowns-lumley-beach-in-fight-against-pollution/" rel="noopener noreferrer">Read the independent article →</a></p><div class="evidence-note"><strong>Accuracy note:</strong> External media coverage is independently written. YSI does not automatically adopt every characterization, number or implication in a third-party article as an official YSI claim.</div></div></div></div></section>

            <section class="section dark"><div class="wrap transparency-grid"><div><p class="eyebrow light">Development-stage work</p><h2>What YSI is building next.</h2><p>YSI is developing a localized waste-interception and circular resource-recovery pilot for Freetown.</p></div><div class="principles"><div><b>01</b><span><strong>Proposed</strong><small>Interception, collection, measurement and recovery pathways remain subject to pilot design and compliance.</small></span></div><div><b>02</b><span><strong>Technical hypothesis</strong><small>RDF/SRF and any thermal pathway require characterization, engineering, emissions review and regulatory approval.</small></span></div><div><b>03</b><span><strong>No invented partnerships</strong><small>Prospective institutions remain targets or potential partners until a real relationship exists.</small></span></div><div><b>04</b><span><strong>Scale follows evidence</strong><small>Replication is considered only after Pilot 1 generates credible operating evidence.</small></span></div></div></div></section>

            <section class="section contact"><div class="wrap contact-box"><div><p class="eyebrow">Explore the model</p><h2>From cleanup to measurable circular systems.</h2><p>See how YSI proposes to move from waste interception and measurement toward realistic recovery pathways.</p></div><div class="contact-actions"><a class="btn btn-primary light-btn" href="flagship.html">Explore the flagship</a><span>info@ysiafrica.org</span></div></div></section>
          </main>
          <footer class="footer"><div class="wrap footer-grid"><div><strong>YSI Africa</strong><span>Young Sustainability Initiative</span><small>Legally incorporated in Sierra Leone as a Company Limited by Guarantee.</small></div><div class="footer-links"><a href="index.html#about">About</a><a href="index.html#work">What We Do</a><a href="flagship.html">Flagship</a><a href="evidence.html">Evidence</a></div><div><small>Website: ysiafrica.org</small><small>Email: info@ysiafrica.org</small></div></div><div class="wrap copyright">© 2026 Young Sustainability Initiative. All rights reserved.</div></footer>
          <script src="script.js?v=20260902static1"></script>
          </body></html>'''
          # Remove YAML indentation from the HTML literal.
          lines = evidence.splitlines()
          evidence = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('evidence.html').write_text(evidence)

          # Add internal navigation links from existing indexable pages.
          for filename in ('index.html', 'flagship.html'):
              p = Path(filename)
              html = p.read_text()
              if 'href="evidence.html"' not in html:
                  target = '<a href="flagship.html">Flagship</a>'
                  if target not in html:
                      raise SystemExit(f'{filename}: flagship nav link not found')
                  html = html.replace(target, target + '\n      <a href="evidence.html">Evidence</a>', 1)
              p.write_text(html)

          # Clarify the organization entity in homepage structured data.
          p = Path('index.html')
          html = p.read_text()
          schema_marker = '"alternateName": "YSI Africa",'
          if '"disambiguatingDescription"' not in html:
              if schema_marker not in html:
                  raise SystemExit('index.html: organization schema marker missing')
              html = html.replace(schema_marker, schema_marker + '\n        "legalName": "Young Sustainability Initiative",\n        "disambiguatingDescription": "Sierra Leone environmental organization operating publicly as YSI Africa; unrelated to other organizations and companies using the acronym YSI.",', 1)
          p.write_text(html)

          # Add evidence page to sitemap.
          p = Path('sitemap.xml')
          sm = p.read_text()
          if 'https://ysiafrica.org/evidence.html' not in sm:
              entry = '''  <url>\n    <loc>https://ysiafrica.org/evidence.html</loc>\n    <lastmod>2026-09-02</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.9</priority>\n  </url>\n'''
              sm = sm.replace('</urlset>', entry + '</urlset>')
          p.write_text(sm)

          # Strengthen the public GitHub repository as an external entity signal.
          readme = '''# YSI Africa — Young Sustainability Initiative\n\nOfficial website repository for **Young Sustainability Initiative (YSI Africa)**, a Sierra Leone environmental organization focused on practical waste management, sanitation, recycling, circular economy, coastal and wetland protection, and resource recovery.\n\n**Official website:** https://ysiafrica.org/\n\n**Evidence & field work:** https://ysiafrica.org/evidence.html\n\nCurrent verified public quantitative impact claim: **20,000+ kg of waste removed.**\n\nYSI separates documented field work from development-stage concepts and does not present prospective institutions as partners without a real relationship.\n'''
          Path('README.md').write_text(readme)

      - name: Verify evidence and authority signals
        shell: python
        run: |
          from pathlib import Path
          evidence = Path('evidence.html').read_text()
          required = [
              'Young Sustainability Initiative — YSI Africa — Sierra Leone',
              '20,000+ kg of waste removed',
              'South Africa Today',
              'External media coverage is independently written',
              'https://ysiafrica.org/evidence.html'
          ]
          for token in required:
              if token not in evidence:
                  raise SystemExit(f'evidence page missing: {token}')
          for filename in ('index.html', 'flagship.html'):
              if 'href="evidence.html"' not in Path(filename).read_text():
                  raise SystemExit(f'{filename}: evidence link missing')
          if 'https://ysiafrica.org/evidence.html' not in Path('sitemap.xml').read_text():
              raise SystemExit('sitemap evidence URL missing')
          if 'https://ysiafrica.org/' not in Path('README.md').read_text():
              raise SystemExit('README official website link missing')
          print('evidence page and entity authority signals verified')

      - name: Commit evidence authority work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence.html index.html flagship.html sitemap.xml README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add YSI evidence and field work authority page"
            git push
          fi
