name: Deploy verified real homepage hero

on:
  push:
    paths:
      - '.github/workflows/deploy-real-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-real-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate real Facebook-sourced photo
        shell: python
        run: |
          import base64, hashlib
          from pathlib import Path

          parts = []
          for i in range(10):
              p = Path(f'assets/real-hero-{i:02d}.txt')
              part = ''.join(p.read_text().split())
              expected = 6000 if i < 9 else 5548
              if len(part) != expected:
                  raise SystemExit(f'{p}: unexpected length {len(part)} != {expected}')
              parts.append(part)

          encoded = ''.join(parts)
          if len(encoded) != 59548:
              raise SystemExit(f'combined Base64 length invalid: {len(encoded)}')
          if hashlib.sha256(encoded.encode()).hexdigest() != '5e48ded42e53f5237a3f575c91fc2ff490f129fdbb4bc9b8870a1f46b46ed6c7':
              raise SystemExit('combined Base64 hash invalid')

          data = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(data).hexdigest() != '0e0a8adc19b74075275d401f81863a635fa0613b470efed58b8241cc29e8c84b':
              raise SystemExit('decoded image hash invalid')
          if not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
              raise SystemExit('decoded JPEG framing invalid')

          Path('assets/ysi-hero-real.jpg').write_bytes(data)
          print('validated decoded bytes:', len(data))

      - name: Verify web image dimensions
        run: |
          file assets/ysi-hero-real.jpg
          test -s assets/ysi-hero-real.jpg
          file assets/ysi-hero-real.jpg | grep -qi 'JPEG image data'
          file assets/ysi-hero-real.jpg | grep -q '600x450'

      - name: Keep hero and force distinct field photography
        run: |
          for f in field-photos.css script.js index.html flagship.html; do
            sed -i 's#assets/ysi-hero.jpg#assets/ysi-hero-real.jpg#g' "$f"
            sed -i 's#20260902photofix1#20260902realhero1#g' "$f"
          done

          # Homepage field-evidence photo: use a different real YSI field image.
          sed -i 's#<img src="assets/ysi-hero-real.jpg?v=20260902realhero1" loading="lazy" alt="Documentary field cleanup work at Lumley Beach in Freetown">#<img src="assets/ysi-field-waste-stream.jpg?v=20260902distinct2" loading="lazy" alt="Mixed coastal waste documented during Lumley Beach field cleanup work in Freetown">#' index.html
          sed -i 's#<figcaption>Documentary field photography from Lumley Beach, Freetown.</figcaption>#<figcaption>Documented waste-stream conditions at Lumley Beach, Freetown.</figcaption>#' index.html

          # Flagship field-evidence photo: use a separate real YSI collection/logistics image.
          sed -i 's#<img src="assets/field-atlas.webp?v=20260901atlas2" loading="lazy" alt="Documentary images from Lumley Beach field work showing cleanup, mixed waste, recovered plastic bottles and a cleaned shoreline">#<img src="assets/ysi-field-collection-logistics.jpg?v=20260902distinct2" loading="lazy" alt="Waste collection tricycle documented during Lumley Beach field operations in Freetown">#' flagship.html
          sed -i 's#<figcaption>Documentary field images from Lumley Beach, Freetown • April 2026.</figcaption>#<figcaption>Documented collection and field logistics from Lumley Beach, Freetown.</figcaption>#' flagship.html

          # Force browsers to load the new script instead of cached copies.
          sed -i 's#script.js?v=20260902realhero1#script.js?v=20260902distinct2#g' index.html
          sed -i 's#script.js?v=20260901atlas2#script.js?v=20260902distinct2#g' flagship.html
          sed -i 's#20260902distinct1#20260902distinct2#g' script.js

          rm -f assets/ysi-hero.jpg

      - name: Commit distinct field photography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use distinct real YSI field photos across site"
            git push
          fi
