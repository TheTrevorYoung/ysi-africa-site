name: Wire simple static YSI field photos

on:
  push:
    paths:
      - '.github/workflows/deploy-real-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-static-field-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean static photo assets
        run: |
          test -s assets/ysi-field-waste-stream.webp
          test -s assets/ysi-field-collection-logistics.webp
          file assets/ysi-field-waste-stream.webp
          file assets/ysi-field-collection-logistics.webp
          file assets/ysi-field-waste-stream.webp | grep -qi webp
          file assets/ysi-field-collection-logistics.webp | grep -qi webp

      - name: Point HTML directly to static WebP files
        shell: python
        run: |
          import re
          from pathlib import Path

          targets = [
              (
                  'index.html',
                  'assets/ysi-field-waste-stream.webp',
                  'Mixed coastal waste documented during Lumley Beach field cleanup work in Freetown'
              ),
              (
                  'flagship.html',
                  'assets/ysi-field-collection-logistics.webp',
                  'Waste collection tricycle documented during Lumley Beach field operations in Freetown'
              ),
          ]

          for html_name, src, alt in targets:
              p = Path(html_name)
              html = p.read_text()
              pattern = r'(<figure class="field-mosaic">\s*)<img\b[^>]*>'
              replacement = rf'\1<img src="{src}" loading="lazy" alt="{alt}">'
              html, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{html_name}: field image replacement failed')
              html = re.sub(r'field-photos\.css\?v=[^"\']+', 'field-photos.css?v=20260902static1', html)
              html = re.sub(r'script\.js\?v=[^"\']+', 'script.js?v=20260902static1', html)
              if 'data:image/' in html:
                  raise SystemExit(f'{html_name}: inline field image data remains')
              if f'src="{src}"' not in html:
                  raise SystemExit(f'{html_name}: direct static photo reference missing')
              p.write_text(html)

      - name: Remove field-photo JavaScript entirely
        shell: python
        run: |
          from pathlib import Path

          script = """const button = document.querySelector('.menu');
          const nav = document.querySelector('.nav');
          if (button && nav) {
            button.addEventListener('click', () => {
              const open = nav.classList.toggle('open');
              button.setAttribute('aria-expanded', String(open));
            });
            nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
              nav.classList.remove('open');
              button.setAttribute('aria-expanded', 'false');
            }));
          }

          // Preserve the approved homepage hero photograph exactly as-is.
          const heroPhoto = document.querySelector('.hero-photo');
          if (heroPhoto) {
            const oldImage = heroPhoto.querySelector('img');
            if (oldImage) {
              const documentaryHero = document.createElement('div');
              documentaryHero.className = 'field-hero-image';
              documentaryHero.setAttribute('role', 'img');
              documentaryHero.setAttribute('aria-label', 'Documentary field cleanup work at Lumley Beach in Freetown');
              oldImage.replaceWith(documentaryHero);
            }
            const caption = heroPhoto.querySelector('figcaption');
            if (caption) caption.textContent = 'Documentary field photography from Lumley Beach cleanup work in Freetown.';
          }
          """
          Path('script.js').write_text(script)

      - name: Use simple static image CSS
        shell: python
        run: |
          from pathlib import Path

          css = """/* Simple static photography, matching the 16-step asset approach. */
          .field-hero-image{
            width:100%;
            aspect-ratio:1.44/1;
            background-image:url("assets/ysi-hero-real.jpg?v=20260902realhero1");
            background-repeat:no-repeat;
            background-size:cover;
            background-position:center;
            border-radius:inherit;
          }

          .field-evidence-grid{
            display:grid;
            grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
            gap:clamp(28px,5vw,64px);
            align-items:center;
          }

          .field-evidence-copy .lede{margin-bottom:16px;}
          .field-proof{display:flex;flex-direction:column;gap:4px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(7,92,55,.2);}
          .field-proof strong{color:#075c37;text-transform:uppercase;letter-spacing:.08em;font-size:.84rem;}
          .field-proof span{color:#59645e;font-size:.95rem;}

          .field-mosaic{
            margin:0;
            border:1px solid #cbd8d0;
            border-radius:24px;
            overflow:hidden;
            background:#fff;
            box-shadow:0 18px 45px rgba(22,45,35,.10);
          }

          .field-mosaic img{
            display:block;
            width:100%;
            height:auto;
          }

          .field-mosaic figcaption{padding:14px 18px 16px;color:#59645e;font-size:.9rem;line-height:1.45;}

          @media (max-width:780px){
            .field-evidence-grid{grid-template-columns:1fr;gap:26px;}
            .field-mosaic{border-radius:18px;}
          }
          """
          Path('field-photos.css').write_text(css)

      - name: Verify no old photo machinery remains
        shell: python
        run: |
          from pathlib import Path

          script = Path('script.js').read_text()
          for token in ('homepageFieldPhoto', 'flagshipFieldPhoto', 'setFieldEvidencePhoto', 'fieldPhotoStyles'):
              if token in script:
                  raise SystemExit(f'old field-photo JS remains: {token}')

          css = Path('field-photos.css').read_text()
          if '.field-mosaic::before' in css or 'display:none' in css:
              raise SystemExit('old field-photo CSS overlay/hide rule remains')

          homepage = Path('index.html').read_text()
          flagship = Path('flagship.html').read_text()
          if 'assets/ysi-field-waste-stream.webp' not in homepage:
              raise SystemExit('homepage static WebP missing')
          if 'assets/ysi-field-collection-logistics.webp' not in flagship:
              raise SystemExit('flagship static WebP missing')
          print('simple static photo wiring verified')

      - name: Commit simple static photo wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html flagship.html script.js field-photos.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Wire clean field photos like 16-step graphics"
            git push
          fi
