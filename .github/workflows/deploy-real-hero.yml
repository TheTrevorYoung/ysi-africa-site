name: Deploy verified real homepage hero

on:
  push:
    paths:
      - '.github/workflows/deploy-real-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-real-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate real Facebook-sourced photo
        shell: python
        run: |
          import base64, hashlib
          from pathlib import Path

          parts = []
          for i in range(10):
              p = Path(f'assets/real-hero-{i:02d}.txt')
              part = ''.join(p.read_text().split())
              expected = 6000 if i < 9 else 5548
              if len(part) != expected:
                  raise SystemExit(f'{p}: unexpected length {len(part)} != {expected}')
              parts.append(part)

          encoded = ''.join(parts)
          if len(encoded) != 59548:
              raise SystemExit(f'combined Base64 length invalid: {len(encoded)}')
          if hashlib.sha256(encoded.encode()).hexdigest() != '5e48ded42e53f5237a3f575c91fc2ff490f129fdbb4bc9b8870a1f46b46ed6c7':
              raise SystemExit('combined Base64 hash invalid')

          data = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(data).hexdigest() != '0e0a8adc19b74075275d401f81863a635fa0613b470efed58b8241cc29e8c84b':
              raise SystemExit('decoded image hash invalid')
          if not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
              raise SystemExit('decoded JPEG framing invalid')

          Path('assets/ysi-hero-real.jpg').write_bytes(data)
          print('validated decoded bytes:', len(data))

      - name: Verify field image files
        shell: python
        run: |
          from pathlib import Path

          for name in ('ysi-field-waste-stream.jpg', 'ysi-field-collection-logistics.jpg'):
              p = Path('assets') / name
              if not p.exists() or p.stat().st_size < 5000:
                  raise SystemExit(f'{p}: missing or unexpectedly small')
              data = p.read_bytes()
              if not data.startswith(b'\xff\xd8'):
                  raise SystemExit(f'{p}: missing JPEG start marker')
              print(name, p.stat().st_size)

      - name: Embed distinct field photos directly in HTML
        shell: python
        run: |
          import base64, re
          from pathlib import Path

          targets = [
              ('index.html', 'ysi-field-waste-stream.jpg', 'Mixed coastal waste documented during Lumley Beach field cleanup work in Freetown'),
              ('flagship.html', 'ysi-field-collection-logistics.jpg', 'Waste collection tricycle documented during Lumley Beach field operations in Freetown'),
          ]

          for html_name, image_name, alt in targets:
              html_path = Path(html_name)
              html = html_path.read_text()
              data = base64.b64encode((Path('assets') / image_name).read_bytes()).decode('ascii')
              data_uri = f'data:image/jpeg;base64,{data}'
              pattern = rf'<img\s+src="(?:assets/{re.escape(image_name)}\?v=[^"]+|data:image/jpeg;base64,[^"]+)"\s+(?:loading="lazy"\s+)?alt="[^"]*">'
              replacement = f'<img src="{data_uri}" alt="{alt}">'
              html, count = re.subn(pattern, replacement, html, count=1)
              if count != 1:
                  raise SystemExit(f'{html_name}: could not replace field image')
              html = html.replace('field-photos.css?v=20260902distinct3', 'field-photos.css?v=20260902distinct4')
              html = html.replace('script.js?v=20260902distinct3', 'script.js?v=20260902distinct4')
              html_path.write_text(html)

          script_path = Path('script.js')
          script = script_path.read_text()
          script = script.replace("field-photos.css?v=20260902distinct3", "field-photos.css?v=20260902distinct4")
          old = "if (image) {\n    image.src = src;\n    image.alt = alt;\n  }"
          new = "if (image) {\n    if (!image.src.startsWith('data:image/')) image.src = src;\n    image.alt = alt;\n  }"
          if old in script:
              script = script.replace(old, new)
          elif new not in script:
              raise SystemExit('script.js: expected field-image assignment block not found')
          script_path.write_text(script)

      - name: Ensure field-photo CSS renders actual images
        shell: python
        run: |
          from pathlib import Path
          p = Path('field-photos.css')
          css = p.read_text()
          if '.field-mosaic img' not in css or 'display:block' not in css:
              raise SystemExit('field-photos.css: field image display rule missing')
          if '.field-mosaic::before{display:none!important' not in css:
              raise SystemExit('field-photos.css: old overlay failsafe is not disabled')
          print('field-photo CSS validated')

      - name: Commit embedded field photography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Embed distinct YSI field photos directly in pages"
            git push
          fi
