name: Strengthen YSI flagship SEO and credibility

on:
  push:
    paths:
      - '.github/workflows/deploy-real-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-flagship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve flagship search signals and credibility wording
        shell: python
        run: |
          from pathlib import Path

          p = Path('flagship.html')
          html = p.read_text()

          replacements = {
            '<title>Local Waste. Local Value. Local Energy. | YSI Africa</title>': '<title>Freetown Circular Waste Pilot | YSI Africa Sierra Leone</title>',
            '<meta name="description" content="YSI Africa is developing a localized waste-interception and circular resource-recovery pilot for Freetown built around measurement, characterization, sorting, recovery testing and evidence-led replication.">': '<meta name="description" content="YSI Africa is developing a localized circular waste pilot in Freetown, Sierra Leone focused on waste interception, measurement, characterization, sorting, recovery testing and evidence-led replication.">',
            '<meta name="theme-color" content="#075c37">': '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n  <meta name="theme-color" content="#075c37">',
            '<link rel="canonical" href="https://ysiafrica.org/flagship.html">': '<link rel="canonical" href="https://ysiafrica.org/flagship.html">\n  <meta property="og:site_name" content="YSI Africa">\n  <meta property="og:title" content="Freetown Circular Waste Pilot | YSI Africa Sierra Leone">\n  <meta property="og:description" content="A development-stage YSI Africa pilot for localized waste interception, measurement, characterization, sorting, recovery testing and evidence-led replication in Freetown, Sierra Leone.">\n  <meta property="og:type" content="website">\n  <meta property="og:url" content="https://ysiafrica.org/flagship.html">\n  <meta property="og:image" content="https://ysiafrica.org/assets/ysi-field-collection-logistics.webp">\n  <meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:title" content="Freetown Circular Waste Pilot | YSI Africa Sierra Leone">\n  <meta name="twitter:description" content="A development-stage circular waste and resource-recovery pilot concept for Freetown, Sierra Leone.">\n  <meta name="twitter:image" content="https://ysiafrica.org/assets/ysi-field-collection-logistics.webp">',
            '<h1>Local Waste.<br><span>Local Value.</span><br>Local Energy.</h1>': '<h1>Local Waste.<br><span>Local Value.</span><br>Better Systems.</h1>',
            'YSI-controlled haulage services bins according to actual use.': 'Compliant collection and haulage would service bins according to actual use.',
            'Covered skip bins capture waste close to where it is produced.': 'Proposed covered skip bins would capture waste close to where it is produced.',
            'Every load is weighed, recorded and linked to its collection point.': 'Incoming loads would be weighed, recorded and linked to their collection point.',
            'Incoming waste is checked for hazards, contamination and unsuitable items.': 'Incoming waste would be checked for hazards, contamination and unsuitable items.',
            'Materials move through the sorting process for identification.': 'Materials would move through a sorting process for identification and characterization.',
            'Recyclables, organics, energy candidates, special waste and true residual are divided.': 'Recyclables, organics, potential energy candidates, special waste and true residual would be separated for evaluation.',
            'Each separated stream moves to its designated recovery or control pathway.': 'Each separated stream would be routed only to a recovery, treatment or disposal pathway supported by evidence and compliance requirements.',
            'Suitable combustible residual is cleaned and prepared for RDF processing.': 'Suitable combustible residual could be prepared for RDF/SRF testing only if characterization supports that pathway.',
            'Excess moisture is removed from the energy-candidate material.': 'If an energy pathway is justified, moisture reduction requirements would be tested.',
            'Dried material is reduced to the required size.': 'If justified, prepared material would be size-reduced to specifications established through testing.',
            'The prepared material becomes refuse-derived fuel.': 'Prepared material would be tested to determine whether it can meet RDF/SRF requirements.',
            'RDF is used in a controlled thermal system and recovered heat returns to Step 09.': 'If validated and approved, RDF/SRF could be tested in a controlled thermal system and heat-recovery performance measured.',
            'Bottom ash, fly ash and pollution-control residues are kept separate.': 'If a thermal trial is justified, residues would be captured and kept separate for testing and control.',
            'Tested bottom ash may support construction use; other residues are controlled.': 'Tested bottom ash may have a construction pathway only if compliant testing supports it; other residues would require appropriate control.',
            'Unit 01 informs a better Unit 02 and a standardized Unit 03.': 'Evidence from Unit 01 would determine whether and how a later unit should be improved or replicated.',
            'Multiple Circular Resource Units form the Freetown Circular Grid.': 'Multiple units could form a wider Freetown network only after Pilot 1 proves the operating model.'
          }

          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Expected text not found: {old[:90]}')
              html = html.replace(old, new, 1)

          structured = '''\n  <script type="application/ld+json">\n  {\n    "@context": "https://schema.org",\n    "@type": "WebPage",\n    "name": "Freetown Circular Waste Pilot | YSI Africa Sierra Leone",\n    "url": "https://ysiafrica.org/flagship.html",\n    "description": "YSI Africa is developing a localized circular waste pilot in Freetown, Sierra Leone focused on interception, measurement, characterization, sorting, recovery testing and evidence-led replication.",\n    "isPartOf": {"@id": "https://ysiafrica.org/#website"},\n    "about": {"@id": "https://ysiafrica.org/#organization"},\n    "inLanguage": "en"\n  }\n  </script>'''
          marker = '  <link rel="stylesheet" href="field-photos.css?v=20260902static1">'
          if structured.strip() not in html:
              if marker not in html:
                  raise SystemExit('stylesheet marker not found for structured data insertion')
              html = html.replace(marker, marker + structured, 1)

          p.write_text(html)

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text().replace('<lastmod>2026-09-02</lastmod>', '<lastmod>2026-09-02</lastmod>')
          sitemap.write_text(sm)

      - name: Verify flagship safeguards
        shell: python
        run: |
          from pathlib import Path
          html = Path('flagship.html').read_text()
          required = [
              'Freetown Circular Waste Pilot | YSI Africa Sierra Leone',
              'meta name="robots" content="index,follow',
              'Better Systems.',
              'Compliant collection and haulage would service bins',
              'Prepared material would be tested to determine whether it can meet RDF/SRF requirements.',
              'Multiple units could form a wider Freetown network only after Pilot 1 proves the operating model.'
          ]
          for item in required:
              if item not in html:
                  raise SystemExit(f'Missing required update: {item}')
          forbidden = [
              'YSI-controlled haulage services bins',
              'The prepared material becomes refuse-derived fuel.',
              'RDF is used in a controlled thermal system and recovered heat returns to Step 09.'
          ]
          for item in forbidden:
              if item in html:
                  raise SystemExit(f'Credibility overclaim remains: {item}')
          print('flagship SEO and credibility safeguards verified')

      - name: Commit improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flagship.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Strengthen flagship SEO and credibility wording"
            git push
          fi
