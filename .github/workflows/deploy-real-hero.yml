name: Repair YSI field photos

on:
  push:
    paths:
      - '.github/workflows/deploy-real-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-field-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair truncated JPEG files and embed them
        shell: python
        run: |
          import base64, re
          from pathlib import Path

          targets = [
              ('index.html', 'ysi-field-waste-stream.jpg', 'Mixed coastal waste documented during Lumley Beach field cleanup work in Freetown'),
              ('flagship.html', 'ysi-field-collection-logistics.jpg', 'Waste collection tricycle documented during Lumley Beach field operations in Freetown'),
          ]

          for html_name, image_name, alt in targets:
              image_path = Path('assets') / image_name
              data = image_path.read_bytes()
              if len(data) < 5000 or not data.startswith(b'\xff\xd8'):
                  raise SystemExit(f'{image_path}: invalid JPEG source')
              # The repository copies were truncated before the JPEG end marker.
              # Add the required EOI marker so browsers accept the recovered progressive JPEG.
              if not data.endswith(b'\xff\xd9'):
                  data += b'\xff\xd9'
                  image_path.write_bytes(data)
              if not data.endswith(b'\xff\xd9'):
                  raise SystemExit(f'{image_path}: JPEG repair failed')

              html_path = Path(html_name)
              html = html_path.read_text()
              marker = 'field-mosaic'
              start = html.find(marker)
              if start < 0:
                  raise SystemExit(f'{html_name}: field mosaic not found')
              img_start = html.find('<img', start)
              img_end = html.find('>', img_start)
              if img_start < 0 or img_end < 0:
                  raise SystemExit(f'{html_name}: field image not found')
              encoded = base64.b64encode(data).decode('ascii')
              replacement = f'<img src="data:image/jpeg;base64,{encoded}" alt="{alt}">'
              html = html[:img_start] + replacement + html[img_end + 1:]
              html = re.sub(r'field-photos\.css\?v=[^"\']+', 'field-photos.css?v=20260902repair1', html)
              html = re.sub(r'script\.js\?v=[^"\']+', 'script.js?v=20260902repair1', html)
              html_path.write_text(html)

          script_path = Path('script.js')
          script = script_path.read_text()
          script = re.sub(r"field-photos\.css\?v=[^'\"]+", 'field-photos.css?v=20260902repair1', script)
          script = script.replace(
              "if (image) {\n    image.src = src;\n    image.alt = alt;\n  }",
              "if (image) {\n    if (!image.src.startsWith('data:image/')) image.src = src;\n    image.alt = alt;\n  }"
          )
          script_path.write_text(script)

          css_path = Path('field-photos.css')
          css = css_path.read_text()
          css = re.sub(
              r'\.field-mosaic img\{[^}]*\}',
              '.field-mosaic img{display:block;width:100%;aspect-ratio:1.44/1;object-fit:cover;object-position:center;background:#eef3ef;}',
              css,
              count=1,
              flags=re.S
          )
          css = re.sub(
              r'\.field-mosaic::before\{[^}]*\}',
              '.field-mosaic::before{display:none!important;content:none!important;}',
              css,
              count=1,
              flags=re.S
          )
          css_path.write_text(css)

      - name: Commit repaired field photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ysi-field-waste-stream.jpg assets/ysi-field-collection-logistics.jpg index.html flagship.html script.js field-photos.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Repair truncated YSI field JPEGs"
            git push
          fi
