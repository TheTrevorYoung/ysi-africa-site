name: Simplify YSI field photos

on:
  push:
    paths:
      - '.github/workflows/deploy-real-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simplify-field-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image converter
        run: python -m pip install --quiet Pillow

      - name: Convert field photos to normal PNG assets
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          pairs = [
              ('ysi-field-waste-stream.jpg', 'ysi-field-waste-stream.png'),
              ('ysi-field-collection-logistics.jpg', 'ysi-field-collection-logistics.png'),
          ]

          for source_name, output_name in pairs:
              source = Path('assets') / source_name
              output = Path('assets') / output_name
              with Image.open(source) as im:
                  im.load()
                  rgb = im.convert('RGB')
                  rgb.save(output, format='PNG', optimize=True)
              with Image.open(output) as check:
                  check.verify()
              if output.stat().st_size < 5000:
                  raise SystemExit(f'{output}: unexpectedly small')
              print(output, output.stat().st_size)

      - name: Use direct static PNG photos in HTML
        shell: python
        run: |
          import re
          from pathlib import Path

          targets = [
              (
                  'index.html',
                  'assets/ysi-field-waste-stream.png',
                  'Mixed coastal waste documented during Lumley Beach field cleanup work in Freetown'
              ),
              (
                  'flagship.html',
                  'assets/ysi-field-collection-logistics.png',
                  'Waste collection tricycle documented during Lumley Beach field operations in Freetown'
              ),
          ]

          for html_name, image_src, alt in targets:
              path = Path(html_name)
              html = path.read_text()
              pattern = r'(<figure class="field-mosaic">\s*)<img\b[^>]*>'
              replacement = rf'\1<img src="{image_src}" loading="lazy" alt="{alt}">'
              html, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{html_name}: field image replacement failed')
              html = re.sub(r'field-photos\.css\?v=[^"\']+', 'field-photos.css?v=20260902simple1', html)
              html = re.sub(r'script\.js\?v=[^"\']+', 'script.js?v=20260902simple1', html)
              path.write_text(html)

      - name: Remove all field-photo JavaScript swapping
        shell: python
        run: |
          from pathlib import Path

          script = """const button = document.querySelector('.menu');
          const nav = document.querySelector('.nav');
          if (button && nav) {
            button.addEventListener('click', () => {
              const open = nav.classList.toggle('open');
              button.setAttribute('aria-expanded', String(open));
            });
            nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
              nav.classList.remove('open');
              button.setAttribute('aria-expanded', 'false');
            }));
          }

          // Preserve the approved homepage hero photograph exactly as-is.
          const heroPhoto = document.querySelector('.hero-photo');
          if (heroPhoto) {
            const oldImage = heroPhoto.querySelector('img');
            if (oldImage) {
              const documentaryHero = document.createElement('div');
              documentaryHero.className = 'field-hero-image';
              documentaryHero.setAttribute('role', 'img');
              documentaryHero.setAttribute('aria-label', 'Documentary field cleanup work at Lumley Beach in Freetown');
              oldImage.replaceWith(documentaryHero);
            }
            const caption = heroPhoto.querySelector('figcaption');
            if (caption) caption.textContent = 'Documentary field photography from Lumley Beach cleanup work in Freetown.';
          }
          """
          Path('script.js').write_text(script)

      - name: Use simple static photo CSS
        shell: python
        run: |
          from pathlib import Path

          css = """/* Simple static photography: same asset pattern as the 16-step graphics. */
          .field-hero-image{
            width:100%;
            aspect-ratio:1.44/1;
            background-image:url("assets/ysi-hero-real.jpg?v=20260902realhero1");
            background-repeat:no-repeat;
            background-size:cover;
            background-position:center;
            border-radius:inherit;
          }

          .field-evidence-grid{
            display:grid;
            grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
            gap:clamp(28px,5vw,64px);
            align-items:center;
          }

          .field-evidence-copy .lede{margin-bottom:16px;}
          .field-proof{display:flex;flex-direction:column;gap:4px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(7,92,55,.2);}
          .field-proof strong{color:#075c37;text-transform:uppercase;letter-spacing:.08em;font-size:.84rem;}
          .field-proof span{color:#59645e;font-size:.95rem;}

          .field-mosaic{
            margin:0;
            border:1px solid #cbd8d0;
            border-radius:24px;
            overflow:hidden;
            background:#fff;
            box-shadow:0 18px 45px rgba(22,45,35,.10);
          }

          .field-mosaic img{
            display:block;
            width:100%;
            height:auto;
          }

          .field-mosaic figcaption{padding:14px 18px 16px;color:#59645e;font-size:.9rem;line-height:1.45;}

          @media (max-width:780px){
            .field-evidence-grid{grid-template-columns:1fr;gap:26px;}
            .field-mosaic{border-radius:18px;}
          }
          """
          Path('field-photos.css').write_text(css)

      - name: Verify simple static photo wiring
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          checks = [
              ('index.html', 'assets/ysi-field-waste-stream.png'),
              ('flagship.html', 'assets/ysi-field-collection-logistics.png'),
          ]
          for html_name, src in checks:
              html = Path(html_name).read_text()
              if f'src="{src}"' not in html:
                  raise SystemExit(f'{html_name}: direct PNG reference missing')
              if 'data:image/' in html:
                  raise SystemExit(f'{html_name}: old inline image data still present')

          script = Path('script.js').read_text()
          forbidden = ['homepageFieldPhoto', 'flagshipFieldPhoto', 'setFieldEvidencePhoto', 'fieldPhotoStyles']
          for token in forbidden:
              if token in script:
                  raise SystemExit(f'script.js: old photo-swapping code remains: {token}')

          for name in ('ysi-field-waste-stream.png', 'ysi-field-collection-logistics.png'):
              p = Path('assets') / name
              with Image.open(p) as im:
                  im.verify()
              print('verified', name, p.stat().st_size)

      - name: Commit simple static field photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ysi-field-waste-stream.png assets/ysi-field-collection-logistics.png index.html flagship.html script.js field-photos.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use simple static PNG field photos like 16-step graphics"
            git push
          fi
