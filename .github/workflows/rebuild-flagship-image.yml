name: Rebuild flagship image

on:
  push:
    paths:
      - '.github/workflows/rebuild-flagship-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate atlas chunks and decode
        shell: python
        run: |
          import base64, hashlib
          from pathlib import Path
          expected = [
            (12000, 'a7228d81ecd7ef3162beb3503ffdeae4f041cf6f990ac3275bc50f38d91622f0'),
            (12000, 'c806be40eda95793a0856fcdb04b2644ee1647979a6ad86a525cbbc4f5a8fe9e'),
            (12000, '5fb14e86129a6eb814c6bd48ef8f0236c8d406422d1113cb5b6bc3b3c543f2f6'),
            (9560, 'cb1153fb92c0f9a68fb17a6692d1aefb8dbcfed1c3800d873e81fcaaad1f3799'),
          ]
          parts = []
          for i, (exp_len, exp_hash) in enumerate(expected):
              part = ''.join(Path(f'assets/flagship-clean-{i:02d}.txt').read_text().split())
              digest = hashlib.sha256(part.encode()).hexdigest()
              print(f'chunk {i}: len={len(part)} sha256={digest}')
              if len(part) != exp_len or digest != exp_hash:
                  raise SystemExit(f'chunk {i} does not match approved source')
              parts.append(part)
          encoded = ''.join(parts)
          print('combined:', len(encoded), hashlib.sha256(encoded.encode()).hexdigest())
          if hashlib.sha256(encoded.encode()).hexdigest() != '8c00f71ae52dbabee78834824315632f69823ffef66caa257f3618ed27054b95':
              raise SystemExit('combined Base64 does not match approved atlas')
          data = base64.b64decode(encoded)
          if not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
              raise SystemExit('decoded JPEG framing invalid')
          Path('assets/flagship-approved-rebuilt.jpg').write_bytes(data)
          print('decoded bytes:', len(data))

      - name: Verify real atlas dimensions
        run: |
          file assets/flagship-approved-rebuilt.jpg
          file assets/flagship-approved-rebuilt.jpg | grep -qi 'JPEG image data'
          file assets/flagship-approved-rebuilt.jpg | grep -q '400x400'

      - name: Cache-bust corrected image
        run: |
          sed -i 's/flagship-approved-rebuilt.jpg?v=20260901c/flagship-approved-rebuilt.jpg?v=20260901d/g' flagship-visuals.css
          sed -i 's/flagship-visuals.css?v=20260901c/flagship-visuals.css?v=20260901d/g' flagship.html

      - name: Commit corrected atlas and page assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flagship-approved-rebuilt.jpg flagship-visuals.css flagship.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy corrected 400px flagship atlas"
            git push
          fi
