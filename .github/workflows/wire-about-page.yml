name: Wire About page into site navigation

on:
  push:
    paths:
      - '.github/workflows/wire-about-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-about:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link homepage navigation to full About page
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text()
          old = 'href="#about"'
          count = html.count(old)
          if count < 2:
              raise SystemExit(f'Expected at least 2 About anchors, found {count}')
          html = html.replace(old, 'href="about.html"')
          p.write_text(html)
          print(f'Rewired {count} About links')

      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text()
          if '<a href="about.html">About YSI</a>' not in html:
              raise SystemExit('Main About link not updated')
          if '<a href="about.html">About</a>' not in html:
              raise SystemExit('Footer About link not updated')
          print('About page navigation verified')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Link homepage navigation to full About page"
            git push
          fi
