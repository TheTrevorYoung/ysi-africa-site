name: Harden production image rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-image-rendering.yml'

permissions:
  contents: write

jobs:
  harden-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build individual concept images and remove rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')
          images = root / 'assets' / 'images'
          version = '20260903imgfix1'

          # 1) Generate real individual image files for concept steps that previously
          # depended on CSS sprite positioning. Keep approved standardized/final files
          # for the steps that already have dedicated production artwork.
          sprite = images / 'flagship-hq.webp'
          if sprite.exists():
              im = Image.open(sprite).convert('RGB')
              w, h = im.size
              xs = [round(i*w/4) for i in range(5)]
              ys = [round(i*h/4) for i in range(5)]
              dedicated = {6,10,12,14,15,16}
              for n in range(1,17):
                  if n in dedicated:
                      continue
                  idx = n - 1
                  row, col = divmod(idx, 4)
                  crop = im.crop((xs[col], ys[row], xs[col+1], ys[row+1]))
                  crop.save(images / f'step{n:02d}-concept.webp', 'WEBP', quality=88, method=6)

          # 2) Make all local production image references root-absolute. This removes
          # ambiguity from relative URL resolution on custom-domain and nested routes.
          html_files = list(root.glob('*.html'))
          for p in html_files:
              text = p.read_text(encoding='utf-8')
              text = text.replace('src="assets/images/', 'src="/assets/images/')
              text = text.replace('href="assets/images/', 'href="/assets/images/')
              text = re.sub(r'field-photos\.css\?v=[^"\']+', f'field-photos.css?v={version}', text)
              text = re.sub(r'flagship-visuals\.css\?v=[^"\']+', f'flagship-visuals.css?v={version}', text)
              text = re.sub(r'script\.js\?v=[^"\']+', f'script.js?v={version}', text)
              p.write_text(text, encoding='utf-8')

          for name in ['field-photos.css','flagship-visuals.css']:
              p = root / name
              if p.exists():
                  text = p.read_text(encoding='utf-8')
                  text = text.replace('url("assets/images/', 'url("/assets/images/')
                  text = text.replace("url('assets/images/", "url('/assets/images/")
                  text = re.sub(r'\?v=2026090[^"\')]+', f'?v={version}', text)
                  p.write_text(text, encoding='utf-8')

          js = root / 'script.js'
          if js.exists():
              text = js.read_text(encoding='utf-8')
              text = text.replace("'assets/images/", "'/assets/images/")
              text = text.replace('"assets/images/', '"/assets/images/')
              text = text.replace('20260902realhero2', version)
              js.write_text(text, encoding='utf-8')

          # 3) Put the homepage hero photography directly in HTML. It must not depend
          # on JavaScript execution or a CSS background in order to exist.
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          pattern = re.compile(r'<figure class="hero-photo"><div class="field-hero-image" role="img" aria-label="Documentary field cleanup work at Lumley Beach in Freetown"></div><figcaption>Documentary field photography from Lumley Beach cleanup work in Freetown\.</figcaption></figure>')
          replacement = f'''<figure class="hero-photo"><img class="field-hero-image" src="/assets/images/ysi-hero-real.jpg?v={version}" alt="Documentary field cleanup work at Lumley Beach in Freetown" loading="eager" decoding="async" fetchpriority="high"><figcaption>Documentary field photography from Lumley Beach cleanup work in Freetown.</figcaption><div class="hero-proof-rail" aria-label="Additional YSI field evidence"><figure><img src="/assets/images/ysi-field-waste-stream.webp?v={version}" loading="eager" decoding="async" alt="Mixed coastal waste documented during YSI field work at Lumley Beach"><figcaption>Waste-stream conditions</figcaption></figure><figure><img src="/assets/images/ysi-field-collection-logistics.webp?v={version}" loading="eager" decoding="async" alt="Documented collection and field logistics during YSI environmental work in Freetown"><figcaption>Collection & field logistics</figcaption></figure></div></figure>'''
          text, count = pattern.subn(replacement, text)
          if count == 0 and '<figure class="hero-photo">' in text and '<img class="field-hero-image"' not in text:
              raise SystemExit('Could not safely replace homepage hero visual')
          index.write_text(text, encoding='utf-8')

          # 4) Give the hero's nested proof images explicit static CSS so they do not
          # rely on script-injected styles and are not captured by the old broad image rule.
          field_css = root / 'field-photos.css'
          css = field_css.read_text(encoding='utf-8')
          hardening = f'''

/* Production image hardening {version}: real image elements, no JS/background dependency. */
.hero-photo > img.field-hero-image{{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;}}
.hero-photo .hero-proof-rail{{position:absolute;z-index:4;left:12px;right:12px;bottom:54px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}}
.hero-photo .hero-proof-rail figure{{margin:0;display:grid;grid-template-columns:82px 1fr;align-items:center;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.75);box-shadow:0 6px 20px rgba(0,0,0,.12);}}
.hero-photo .hero-proof-rail img{{position:static!important;inset:auto!important;display:block!important;width:82px!important;height:60px!important;object-fit:cover!important;}}
.hero-photo .hero-proof-rail figcaption{{position:static!important;inset:auto!important;max-width:none!important;background:transparent!important;color:#33443b!important;padding:7px 9px!important;border-radius:0!important;backdrop-filter:none!important;font-size:.66rem!important;font-weight:800;}}
@media(max-width:760px){{.hero-photo .hero-proof-rail{{bottom:50px;left:8px;right:8px;gap:6px}}.hero-photo .hero-proof-rail figure{{grid-template-columns:64px 1fr}}.hero-photo .hero-proof-rail img{{width:64px!important;height:52px!important}}.hero-photo .hero-proof-rail figcaption{{font-size:.58rem!important;padding:5px 6px!important}}}}
'''
          if f'Production image hardening {version}' not in css:
              css += hardening
          field_css.write_text(css, encoding='utf-8')

          # 5) On the advanced technical library, replace CSS-background tiles with
          # real <img> elements. This makes every visible concept illustration a real
          # production file from /assets/images/.
          tech = root / 'technical-concept.html'
          if tech.exists():
              text = tech.read_text(encoding='utf-8')
              dedicated = {
                  6:'step06-standardized.webp',
                  10:'step10-standardized.webp',
                  12:'step12-standardized.webp',
                  14:'step14-standardized.webp',
                  15:'step15-final.webp',
                  16:'step16-final.webp',
              }
              for n in range(1,17):
                  nn = f'{n:02d}'
                  fname = dedicated.get(n, f'step{nn}-concept.webp')
                  pat = re.compile(rf'<div class="step-thumb step-{nn}" role="img" aria-label="([^"]+)"></div>')
                  text = pat.sub(rf'<img class="step-image step-{nn}" src="/assets/images/{fname}?v={version}" alt="\1" loading="lazy" decoding="async">', text)
              extra_css = '.step-image{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:0;border-bottom:1px solid var(--line);background:#e6eee8}'
              if extra_css not in text:
                  text = text.replace('</style>', f'    {extra_css}\n  </style>', 1)
              tech.write_text(text, encoding='utf-8')

          # 6) Version every ordinary local image reference used in HTML where no query
          # is present, while leaving external/metadata absolute URLs alone.
          for p in html_files:
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'(src="/assets/images/[^"?]+)(")', rf'\1?v={version}\2', text)
              p.write_text(text, encoding='utf-8')
          PY

          # Remove this one-time workflow after it has done its job.
          rm -f .github/workflows/harden-image-rendering.yml

          git config user.name "YSI Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden site image rendering from canonical image library"
          git push
