name: One-time YSI entity authority update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-entity-authority.yml'

permissions:
  contents: write

jobs:
  update-entity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add founder and independent-coverage signals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '        "sameAs": ["https://www.linkedin.com/company/shea-salone/"],\n        "description":'
          addition = '''        "sameAs": ["https://www.linkedin.com/company/shea-salone/"],
        "founder": {
          "@type": "Person",
          "name": "Trevor Young",
          "sameAs": ["https://www.linkedin.com/in/trevor-young-184b0017"]
        },
        "subjectOf": {
          "@type": "NewsArticle",
          "headline": "Young Volunteers Clear 100 Days of Plastic Waste from Freetown’s Lumley Beach in Fight Against Pollution",
          "url": "https://southafricatoday.net/africa/young-volunteers-clear-100-days-of-plastic-waste-from-freetowns-lumley-beach-in-fight-against-pollution/",
          "datePublished": "2026-04-12",
          "publisher": {"@type": "Organization", "name": "South Africa Today"}
        },
        "description":'''
          if '"founder": {' not in text:
              if marker not in text:
                  raise SystemExit('Expected schema marker not found')
              text = text.replace(marker, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add verified founder and media authority signals'
          git push
