name: One-time homepage SEO identity update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-homepage-identity.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply targeted SEO identity changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_title = 'YSI Africa | Young Sustainability Initiative Sierra Leone'
          new_title = 'YSI Africa Sierra Leone | Young Sustainability Initiative'
          text = text.replace(old_title, new_title)

          marker = '        "email": "info@ysiafrica.org",\n        "description":'
          replacement = '        "email": "info@ysiafrica.org",\n        "sameAs": ["https://www.linkedin.com/company/shea-salone/"],\n        "description":'
          if '"sameAs": ["https://www.linkedin.com/company/shea-salone/"]' not in text:
              if marker not in text:
                  raise SystemExit('Expected organization schema marker not found')
              text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage SEO identity update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Strengthen YSI Africa search identity signals'
          git push
