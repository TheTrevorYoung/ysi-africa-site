name: Fix production image paths
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-image-paths.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make production images static and root absolute
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          version = '20260903imgfix3'
          root = Path('.')
          images = root / 'assets' / 'images'

          # Generate real image files for concept steps that previously depended on a CSS sprite.
          sprite = images / 'flagship-hq.webp'
          if sprite.exists():
              im = Image.open(sprite).convert('RGB')
              w, h = im.size
              xs = [round(i*w/4) for i in range(5)]
              ys = [round(i*h/4) for i in range(5)]
              for n in range(1, 17):
                  if n in {6,10,12,14,15,16}:
                      continue
                  row, col = divmod(n-1, 4)
                  crop = im.crop((xs[col], ys[row], xs[col+1], ys[row+1]))
                  crop.save(images / f'step{n:02d}-concept.webp', 'WEBP', quality=88, method=6)

          # Root-absolute production image references on all HTML pages.
          for p in root.glob('*.html'):
              text = p.read_text(encoding='utf-8')
              text = text.replace('src="assets/images/', 'src="/assets/images/')
              text = text.replace('href="assets/images/', 'href="/assets/images/')
              text = re.sub(r'field-photos\.css\?v=[^"\s>]+', f'field-photos.css?v={version}', text)
              text = re.sub(r'flagship-visuals\.css\?v=[^"\s>]+', f'flagship-visuals.css?v={version}', text)
              text = re.sub(r'script\.js\?v=[^"\s>]+', f'script.js?v={version}', text)
              p.write_text(text, encoding='utf-8')

          # Homepage: real image elements exist in source HTML before JavaScript runs.
          p = root / 'index.html'
          text = p.read_text(encoding='utf-8')
          old = '<figure class="hero-photo"><div class="field-hero-image" role="img" aria-label="Documentary field cleanup work at Lumley Beach in Freetown"></div><figcaption>Documentary field photography from Lumley Beach cleanup work in Freetown.</figcaption></figure>'
          new = f'<figure class="hero-photo"><img class="field-hero-image" src="/assets/images/ysi-hero-real.jpg?v={version}" alt="Documentary field cleanup work at Lumley Beach in Freetown" loading="eager" decoding="async" fetchpriority="high"><figcaption>Documentary field photography from Lumley Beach cleanup work in Freetown.</figcaption><div class="hero-proof-rail" aria-label="Additional YSI field evidence"><figure><img src="/assets/images/ysi-field-waste-stream.webp?v={version}" loading="eager" decoding="async" alt="Mixed coastal waste documented during YSI field work at Lumley Beach"><figcaption>Waste-stream conditions</figcaption></figure><figure><img src="/assets/images/ysi-field-collection-logistics.webp?v={version}" loading="eager" decoding="async" alt="Documented collection and field logistics during YSI environmental work in Freetown"><figcaption>Collection & field logistics</figcaption></figure></div></figure>'
          if old in text:
              text = text.replace(old, new)
          elif '<img class="field-hero-image"' not in text:
              raise SystemExit('Homepage hero source did not match expected structure')
          p.write_text(text, encoding='utf-8')

          # Hero/proof images must render from CSS alone; no JS-injected style required.
          p = root / 'field-photos.css'
          css = p.read_text(encoding='utf-8')
          css = css.replace('url("assets/images/', 'url("/assets/images/')
          marker = '/* static-image-hardening-20260903 */'
          if marker not in css:
              css += f'''\n\n{marker}\n.hero-photo > img.field-hero-image{{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;}}\n.hero-photo .hero-proof-rail{{position:absolute;z-index:4;left:12px;right:12px;bottom:54px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}}\n.hero-photo .hero-proof-rail figure{{margin:0;display:grid;grid-template-columns:82px 1fr;align-items:center;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.8);}}\n.hero-photo .hero-proof-rail img{{position:static!important;inset:auto!important;display:block!important;width:82px!important;height:60px!important;object-fit:cover!important;}}\n.hero-photo .hero-proof-rail figcaption{{position:static!important;inset:auto!important;max-width:none!important;background:transparent!important;color:#33443b!important;padding:7px 9px!important;border-radius:0!important;backdrop-filter:none!important;font-size:.66rem!important;font-weight:800;}}\n@media(max-width:760px){{.hero-photo .hero-proof-rail{{left:8px;right:8px;bottom:50px;gap:6px}}.hero-photo .hero-proof-rail figure{{grid-template-columns:64px 1fr}}.hero-photo .hero-proof-rail img{{width:64px!important;height:52px!important}}.hero-photo .hero-proof-rail figcaption{{font-size:.58rem!important;padding:5px 6px!important}}}}\n'''
          p.write_text(css, encoding='utf-8')

          # Advanced technical library: use real img tags rather than CSS background tiles.
          p = root / 'technical-concept.html'
          text = p.read_text(encoding='utf-8')
          dedicated = {6:'step06-standardized.webp',10:'step10-standardized.webp',12:'step12-standardized.webp',14:'step14-standardized.webp',15:'step15-final.webp',16:'step16-final.webp'}
          for n in range(1,17):
              nn = f'{n:02d}'
              fname = dedicated.get(n, f'step{nn}-concept.webp')
              pattern = re.compile(rf'<div class="step-thumb step-{nn}" role="img" aria-label="([^"]+)"></div>')
              text = pattern.sub(rf'<img class="step-image step-{nn}" src="/assets/images/{fname}?v={version}" alt="\1" loading="lazy" decoding="async">', text)
          if '.step-image{display:block' not in text:
              text = text.replace('</style>', '    .step-image{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:0;border-bottom:1px solid var(--line);background:#e6eee8}\n  </style>', 1)
          p.write_text(text, encoding='utf-8')

          # JavaScript uses the same root-absolute source if it ever needs a fallback.
          p = root / 'script.js'
          text = p.read_text(encoding='utf-8')
          text = text.replace("'assets/images/", "'/assets/images/")
          text = text.replace('"assets/images/', '"/assets/images/')
          text = text.replace('20260902realhero2', version)
          p.write_text(text, encoding='utf-8')

          # Remaining CSS image references are root-absolute.
          p = root / 'flagship-visuals.css'
          css = p.read_text(encoding='utf-8')
          css = css.replace('url("assets/images/', 'url("/assets/images/')
          css = css.replace("url('assets/images/", "url('/assets/images/")
          p.write_text(css, encoding='utf-8')
          PY

          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Make site images static and canonical' || exit 0
          git push
