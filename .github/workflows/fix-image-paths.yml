name: Fix production image paths
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-image-paths.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize image paths
        run: |
          set -e
          sed -i 's#url("assets/images/#url("/assets/images/#g' field-photos.css flagship-visuals.css
          sed -i "s#url('assets/images/#url('/assets/images/#g" field-photos.css flagship-visuals.css
          sed -i 's#20260902realhero1#20260903imgfix2#g' field-photos.css
          sed -i 's#20260901hq1#20260903imgfix2#g' flagship-visuals.css
          sed -i 's#20260902clean1#20260903imgfix2#g' flagship-visuals.css
          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add field-photos.css flagship-visuals.css
          git commit -m 'Normalize production image paths' || exit 0
          git push
