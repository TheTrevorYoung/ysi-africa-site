name: Convert field evidence images to JPG
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/convert-production-images-to-jpg.yml
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert exact field evidence images and repoint pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          images = root / 'assets' / 'images'
          version = '20260903jpgfix2'
          targets = ['ysi-field-waste-stream.webp','ysi-field-collection-logistics.webp']

          for name in targets:
              src = images / name
              dst = src.with_suffix('.jpg')
              print('converting', src, src.stat().st_size)
              im = Image.open(src)
              print('decoded', name, im.size, im.mode, im.format)
              im.convert('RGB').save(dst, 'JPEG', quality=92, optimize=True, progressive=True)

          for p in list(root.glob('*.html')) + [root/'script.js']:
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('/assets/images/ysi-field-waste-stream.webp', f'/assets/images/ysi-field-waste-stream.jpg?v={version}')
              text = text.replace('assets/images/ysi-field-waste-stream.webp', f'/assets/images/ysi-field-waste-stream.jpg?v={version}')
              text = text.replace('/assets/images/ysi-field-collection-logistics.webp', f'/assets/images/ysi-field-collection-logistics.jpg?v={version}')
              text = text.replace('assets/images/ysi-field-collection-logistics.webp', f'/assets/images/ysi-field-collection-logistics.jpg?v={version}')
              text = text.replace('loading="lazy"', 'loading="eager"') if p.name in ['index.html','about.html','flagship.html','evidence.html'] else text
              p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/convert-production-images-to-jpg.yml
          git config user.name "YSI Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace field evidence WebP files with JPEG production images"
          git push
