name: Load temporary image pause last

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/load-image-pause-last.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link image-pause stylesheet last on every public page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          link = '  <link rel="stylesheet" href="image-pause.css?v=20260903-final1">\n'
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              if 'image-pause.css' in s:
                  continue
              if '</head>' in s:
                  s = s.replace('</head>', link + '</head>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/load-image-pause-last.yml
          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Load temporary image pause after all page styles'
          git push
