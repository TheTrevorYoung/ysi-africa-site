name: Clean orphan image copy and donation language

on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-orphan-image-copy-and-donation-language.yml']

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove orphan image copy and donation-negative language
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def read(name):
              return (root/name).read_text(encoding='utf-8')
          def write(name, body):
              (root/name).write_text(body, encoding='utf-8')
          def must_replace(body, old, new, label):
              if old not in body:
                  raise SystemExit(f'Expected text not found for {label}')
              return body.replace(old, new)

          # Homepage: keep the approved hero image/caption, but remove copy that describes
          # the now-deleted secondary field photograph area.
          s = read('index.html')
          s = must_replace(
              s,
              "<p>Documentary photography from Lumley Beach shows the practical conditions behind YSI's move from cleanup toward measurement, characterization, recovery and stronger environmental systems.</p>",
              "<p>Direct field experience at Lumley Beach informs YSI's move from cleanup toward measurement, characterization, recovery and stronger environmental systems.</p>",
              'homepage orphan photography paragraph'
          )
          s = must_replace(
              s,
              "<p class=\"flagship-home-note\">Phase 0 is non-thermal. RDF/SRF and other thermal pathways remain later technical hypotheses, not the current fundraising proposition.</p>",
              "<p class=\"flagship-home-note\">Phase 0 is non-thermal. Current funding is focused on evidence and operational design; RDF/SRF and other thermal pathways remain later technical hypotheses subject to validation.</p>",
              'homepage negative fundraising wording'
          )
          s = s.replace('styles.css?v=20260903-imagepause1', 'styles.css?v=20260903-clean2')
          s = s.replace('script.js?v=20260903imgfix3', 'script.js?v=20260903-clean2')
          write('index.html', s)

          # Waste Project: state the positive current funding focus rather than what YSI is
          # not fundraising for.
          s = read('flagship.html')
          s = must_replace(
              s,
              '<span>YSI is not fundraising for the full long-term technical concept at this stage.</span>',
              '<span>Current funding is focused on Phase 0 evidence and operational design.</span>',
              'flagship negative fundraising wording'
          )
          s = s.replace('styles.css?v=20260903-imagepause1', 'styles.css?v=20260903-clean2')
          s = s.replace('script.js?v=20260903imgfix3', 'script.js?v=20260903-clean2')
          write('flagship.html', s)

          # Funders page: remove the donate-button / retail-fundraising disclaimer entirely.
          # Do not replace it with another donation policy statement.
          s = read('funders.html')
          before = s
          s = re.sub(r'\s*<div class="no-donate"><strong>No donate button\.</strong>.*?</div>', '', s, flags=re.I|re.S)
          s = re.sub(r'\.no-donate\{[^{}]*\}', '', s, flags=re.I|re.S)
          if s == before:
              raise SystemExit('No-donate block/style not found in funders.html')
          s = s.replace('styles.css?v=20260903-imagepause1', 'styles.css?v=20260903-clean2')
          s = s.replace('script.js?v=20260903imgfix3', 'script.js?v=20260903-clean2')
          write('funders.html', s)

          # Evidence page: remove the obsolete field-gallery selector residue from the old
          # deleted image area while preserving the actual evidence content.
          s = read('evidence.html')
          s = s.replace('.legend-grid,.evidence-index,.field-gallery,.project-evidence,.method-grid{grid-template-columns:1fr}',
                        '.legend-grid,.evidence-index,.project-evidence,.method-grid{grid-template-columns:1fr}')
          s = s.replace('styles.css?v=20260903-imagepause1', 'styles.css?v=20260903-clean2')
          s = s.replace('script.js?v=20260903imgfix3', 'script.js?v=20260903-clean2')
          write('evidence.html', s)

          # Shared JS: only the retained homepage hero may carry photography/caption logic.
          # The evidence dossier should not imply an on-page photo that no longer exists.
          s = read('script.js')
          s = must_replace(
              s,
              '<span>Documented YSI field activity and photography.</span>',
              '<span>Documented YSI field activity and operating records.</span>',
              'evidence dossier photography wording'
          )
          s = s.replace("heroImage.src = '/assets/images/ysi-hero-real.jpg?v=20260903imgfix3';",
                        "heroImage.src = '/assets/images/ysi-hero-real.jpg';")
          write('script.js', s)

          # Clean obsolete cache-buster wording on remaining public pages. This changes no
          # content or layout; it simply removes residue from the previous image cleanup.
          for p in root.glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('styles.css?v=20260903-imagepause1', 'styles.css?v=20260903-clean2')
              s = s.replace('script.js?v=20260903imgfix3', 'script.js?v=20260903-clean2')
              p.write_text(s, encoding='utf-8')

          # Strict audit: the only actual site image/figure is still the approved homepage hero.
          idx = read('index.html')
          if len(re.findall(r'<img\b', idx, flags=re.I)) != 1:
              raise SystemExit('Homepage no longer has exactly one img element')
          if len(re.findall(r'<figure\b', idx, flags=re.I)) != 1:
              raise SystemExit('Homepage no longer has exactly one figure element')
          if len(re.findall(r'<figcaption\b', idx, flags=re.I)) != 1:
              raise SystemExit('Homepage no longer has exactly one figcaption')
          if 'ysi-hero-real.jpg' not in idx:
              raise SystemExit('Approved homepage hero missing')

          for p in root.glob('*.html'):
              body = p.read_text(encoding='utf-8')
              if p.name != 'index.html' and re.search(r'<(?:img|figure|figcaption)\b', body, flags=re.I):
                  raise SystemExit(f'Orphan image markup remains in {p.name}')

          # No public source should discuss a donation refusal or a missing donate button.
          public_sources = list(root.glob('*.html')) + [root/'script.js', root/'styles.css', root/'flagship.css']
          donation_terms = [r'no donate button', r'not accepting donations?', r'not accept donations?', r'retail fundraising']
          for p in public_sources:
              body = p.read_text(encoding='utf-8')
              for term in donation_terms:
                  if re.search(term, body, flags=re.I):
                      raise SystemExit(f'Donation-negative wording remains in {p}: {term}')

          # The deleted visual system should leave no public residue in classes/copy.
          forbidden_residue = ['field-gallery','hero-proof-rail','field-mosaic','field-shot','story-photo','hero-field-photo','system-figure','detail-visual','network-canvas','image-pause','imgfix3','pathfix','livefix','jpgsource']
          for p in public_sources:
              body = p.read_text(encoding='utf-8')
              for token in forbidden_residue:
                  if token in body:
                      raise SystemExit(f'Obsolete image residue remains in {p}: {token}')

          # Photography wording is allowed only for the retained homepage hero/caption and
          # legitimate field-method references, never as copy describing a deleted on-page photo.
          if 'Documentary photography from Lumley Beach shows the practical conditions' in idx:
              raise SystemExit('Orphan homepage photography description remains')

          PY

          rm -f .github/workflows/clean-orphan-image-copy-and-donation-language.yml
          git config user.name 'YSI Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove orphan image copy and donation-negative language'
          git push
